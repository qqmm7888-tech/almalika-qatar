<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الملكة | تجربة تطبيق الجوال</title>
<script src="almalika-data-v2.js"></script>
<style>
:root{
  --bg:#fff7fb;
  --panel:#ffffff;
  --card:#ffffff;
  --card2:#fff1f7;
  --text:#331522;
  --muted:#806a75;
  --brand:#7b1230;
  --pink:#f52f86;
  --red:#ef233c;
  --green:#20c76a;
  --gold:#d4af37;
  --line:#f0c9dc;
}
*{box-sizing:border-box}
html{background:#f7eef3;overflow-x:hidden}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
@media(min-width:760px){
  body{
    width:430px;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    border-left:1px solid #f0c9dc;
    border-right:1px solid #f0c9dc;
    box-shadow:0 0 80px rgba(123,18,48,.13);
  }
}
button,input,select,textarea{font-family:inherit}
button{border:0;cursor:pointer}
a{text-decoration:none;color:inherit}
.top{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(20,18,20,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.appbar{
  padding:12px 14px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.logo{
  font-size:26px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 18px rgba(212,175,55,.22);
}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{
  height:38px;
  border-radius:999px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.wa-pill{background:var(--green);color:#fff}
.cart-pill{background:#fff;color:var(--brand)}
.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 14px 10px;
  scroll-snap-type:x proximity;
}
.nav::-webkit-scrollbar,.chips::-webkit-scrollbar,.cat-icons::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;
  scroll-snap-align:start;
  border-radius:999px;
  background:var(--card);
  color:#fff;
  border:1px solid var(--line);
  padding:10px 13px;
  font-weight:900;
  font-size:12px;
}
.nav button.active{background:var(--red);border-color:transparent}
.search-wrap{padding:10px 14px 12px}
.search{
  height:52px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
}
.search span{font-size:22px;color:#8f878e}
.search input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  font-weight:800;
}
.search input::placeholder{color:#8f878e}
.hero{padding:4px 14px 16px}
.hero-card{
  height:160px;
  background:#241f24;
  border-radius:24px;
  overflow:hidden;
  position:relative;
  border:1px solid #332d32;
}
.hero-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.hero-card:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.28));
  pointer-events:none;
}
.section{padding:8px 0 18px}
.section-title{
  padding:0 14px 12px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
}
.section-title h2{margin:0;font-size:25px;line-height:1.2}
.section-title p{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:800;line-height:1.5}
.link-btn{background:#3a3439;color:#fff;border-radius:999px;padding:9px 12px;font-weight:900;font-size:12px}
.cat-icons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 14px 14px;
}
.cat-card{
  min-height:112px;
  border-radius:22px;
  background:var(--card);
  color:#fff;
  padding:12px 8px;
  text-align:center;
  border:1px solid #332d32;
}
.cat-card .ico{
  width:56px;height:56px;margin:0 auto 8px;
  background:var(--card2);
  border-radius:18px;
  display:grid;place-items:center;
  font-size:27px;
}
.cat-card b{font-size:12px;line-height:1.35;display:block}
.cat-card small{display:block;color:var(--muted);margin-top:6px;font-weight:900}
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:0 14px 12px;
}
.chip{
  flex:0 0 auto;
  border-radius:999px;
  padding:9px 13px;
  background:var(--card);
  color:#fff;
  border:1px solid var(--line);
  font-weight:900;
  font-size:12px;
}
.chip.active{background:#fff;color:#111;border-color:#fff}
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  padding:0 14px 110px;
}
.card{
  background:var(--card);
  border-radius:24px;
  overflow:hidden;
  position:relative;
  border:1px solid #332d32;
  min-width:0;
}
.badge{
  position:absolute;
  top:8px;
  right:8px;
  z-index:2;
  background:#101010;
  color:#fff;
  border-radius:999px;
  padding:5px 8px;
  font-size:10px;
  font-weight:900;
}
.pic{
  height:145px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
}
.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
}
.card-body{padding:10px}
.card h3{
  margin:0 0 6px;
  font-size:13px;
  line-height:1.45;
  min-height:38px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.meta span{
  background:#342f34;
  color:#fff;
  border-radius:999px;
  padding:4px 6px;
  font-size:9px;
  font-weight:800;
}
.price{
  font-weight:900;
  font-size:16px;
  color:#fff;
  margin:6px 0 8px;
}
.card-actions{
  display:grid;
  grid-template-columns:1fr 40px;
  gap:7px;
}
.details-btn{
  height:38px;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:12px;
}
.add-btn{
  height:38px;
  border-radius:999px;
  background:#3a363a;
  color:#fff;
  font-size:24px;
  font-weight:900;
}
.empty{
  grid-column:1/-1;
  padding:24px;
  text-align:center;
  color:var(--muted);
  font-weight:900;
}
.cart-bar{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:12px;
  width:calc(100% - 28px);
  max-width:402px;
  height:58px;
  border-radius:23px;
  background:var(--red);
  color:#fff;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 16px;
  box-shadow:0 14px 35px rgba(0,0,0,.38);
  font-weight:900;
}
.cart-bar button{
  background:transparent;
  color:#fff;
  width:100%;
  height:100%;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:14px;
}
.sheet{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  display:none;
  align-items:flex-end;
}
.sheet.show{display:flex}
.panel{
  width:100%;
  max-width:430px;
  margin:auto auto 0;
  background:var(--bg);
  color:#fff;
  border-radius:30px 30px 0 0;
  max-height:93vh;
  overflow:auto;
  padding:14px 14px 100px;
}
.close{
  position:sticky;
  top:0;
  margin-inline-start:auto;
  width:46px;height:46px;
  border-radius:50%;
  background:#333;
  color:#fff;
  font-size:28px;
  z-index:3;
}
.detail-img{
  width:100%;
  height:285px;
  object-fit:contain;
  background:#fff;
  border-radius:24px;
  display:block;
}
.panel h1{font-size:25px;line-height:1.35;margin:14px 0 8px}
.panel .sub{color:var(--muted);font-weight:800;line-height:1.7;margin:0 0 12px}
.info-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:13px;
  margin:10px 0;
}
.info-box h3{margin:0 0 10px;font-size:18px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-grid div{
  background:var(--card);
  border-radius:16px;
  padding:10px;
  font-size:12px;
  line-height:1.5;
  color:#fff;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  background:var(--card);
  border:1px solid var(--line);
  color:#fff;
  border-radius:18px;
  padding:11px 8px;
  min-height:58px;
  font-weight:900;
  font-size:12px;
}
.opt.active{border-color:var(--red);box-shadow:0 0 0 2px rgba(239,35,60,.25)}
.field{
  width:100%;
  min-height:48px;
  border:1px solid var(--line);
  background:var(--card);
  color:#fff;
  border-radius:16px;
  padding:10px 12px;
  outline:0;
  font-weight:800;
  margin-top:8px;
}
textarea.field{min-height:82px;resize:vertical}
.bottom-actions{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:430px;
  background:linear-gradient(180deg,rgba(20,18,20,.1),#141214 20%);
  padding:14px 14px 16px;
  display:grid;
  grid-template-columns:1fr 120px;
  gap:10px;
  z-index:120;
}
.primary{
  height:54px;
  border-radius:22px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:16px;
}
.qty{
  height:54px;
  border-radius:22px;
  background:#333;
  color:#fff;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:center;
  overflow:hidden;
}
.qty button{height:100%;background:transparent;color:#fff;font-size:22px;font-weight:900}
.qty span{text-align:center;font-weight:900}
.cart-item{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:10px;
  align-items:center;
  background:var(--panel);
  border-radius:20px;
  padding:9px;
  margin:8px 0;
}
.cart-item img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:16px}
.cart-item b{font-size:13px;display:block;line-height:1.4}
.cart-item small{color:var(--muted);font-weight:800;display:block;margin-top:3px}
.del{background:#3a3439;color:#fff;border-radius:14px;padding:9px;font-weight:900}
.total{
  background:#fff;
  color:#111;
  border-radius:20px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  font-weight:900;
  margin:10px 0;
}
@media(max-width:359px){
  .products{grid-template-columns:1fr}
  .cat-icons{grid-template-columns:repeat(2,1fr)}
}
</style>

<style id="almalika-clean-v2-light-fixes">
/* V2 ألوان الملكة + إصلاح عرض البيانات والأسعار */
body{background:linear-gradient(180deg,#fff7fb,#fffaf1)!important;color:#331522!important}
.top{background:rgba(255,255,255,.96)!important;border-bottom:1px solid #f0c9dc!important;box-shadow:0 8px 22px rgba(123,18,48,.06)!important}
.logo{color:#7b1230!important}
.nav button{background:#fff!important;color:#7b1230!important;border:1px solid #f0c9dc!important}

.search{background:#fff!important;border:1px solid #f0c9dc!important}
.search input{color:#331522!important}
.hero-card,.card,.cat-card,.info-box,.cart-item{background:#fff!important;border:1px solid #f0c9dc!important;color:#331522!important}

.section-title p,.card .desc,.sub,.cart-item small{color:#806a75!important}

</head>
<body>
<header class="top">
  <div class="appbar">
    <div class="logo">الملكة 👑</div>
    <div class="top-actions">
      <a class="pill wa-pill" href="https://wa.me/97433317720">واتساب</a>
      <button class="pill cart-pill" onclick="openCart()">السلة <span id="topCount">0</span></button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="search-wrap">
    <div class="search"><span>⌕</span><input id="q" placeholder="ابحث عن نطاطية، سناك، ديكور..." oninput="renderProducts()"></div>
  </div>
</header>

<section class="hero">
  <div class="hero-card"><img src="order-ad.jpg" alt="الملكة" onerror="this.style.display='none'"></div>
</section>

<section class="section">
  <div class="section-title">
    <div>
      <h2>الأقسام الرئيسية</h2>
      <p>اختر القسم ثم أضف منتجاتك للسلة وأرسل الطلب واتساب.</p>
    </div>
  </div>
  <div class="cat-icons" id="catIcons"></div>
</section>

<section class="section">
  <div class="section-title">
    <div>
      <h2 id="sectionTitle">مختارات VIP</h2>
      <p id="sectionDesc">منتجات مختارة من جميع الأقسام.</p>
    </div>
    <button class="link-btn" onclick="setGroup('all')">عرض الكل</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="products" id="products"></div>
</section>

<div class="cart-bar">
  <button onclick="openCart()"><span>🛒 سلة الحجز: <b id="cartCount">0</b></span><span><b id="cartTotal">0</b> ر.ق</span></button>
</div>

<div class="sheet" id="detailSheet"><div class="panel" id="detailPanel"></div></div>
<div class="sheet" id="cartSheet"><div class="panel" id="cartPanel"></div></div>

<script>
const PRODUCTS = window.PRODUCTS || [];
const phone = "97433317720";
const groups = [
  {id:"all", title:"الرئيسية", icon:"👑", match:p=>true, desc:"كل منتجات الملكة في مكان واحد."},
  {id:"bouncies", title:"النطاطيات والزحلاقيات", icon:"🏰", match:p=>sectionOf(p)==="bouncies", desc:"نطاطيات، زحلاقيات، ملاعب صابونية وفوم."},
  {id:"snacks", title:"السناك والعربات", icon:"🍿", match:p=>sectionOf(p)==="snacks", desc:"عربات فشار، غزل البنات، بطاطا، آيس كريم والمزيد."},
  {id:"events", title:"تجهيز الحفلات", icon:"🎈", match:p=>sectionOf(p)==="events", desc:"ديكورات، استاندات، بوابات، بالونات وحفلات."},
  {id:"rentals", title:"الطاولات والكراسي", icon:"🪑", match:p=>sectionOf(p)==="rentals", desc:"طاولات، كراسي وشخصيات كرتونية."},
  {id:"offers", title:"العروض والبكجات", icon:"🎁", match:p=>sectionOf(p)==="offers", desc:"بكجات وعروض مختارة."},
  {id:"other", title:"بنود أخرى", icon:"✨", match:p=>sectionOf(p)==="other", desc:"خدمات وبنود إضافية."}
];
let current="all", currentCat="", currentProduct=null, selectedOption=null, qty=1;
let cart = JSON.parse(localStorage.getItem("almalikaCleanCart") || "[]");

function sectionOf(p){
  const c=p.category||"", t=p.type||"", n=p.name||"", d=p.details||"", num=Number(p.number||p.id||0);
  const blob=c+" "+t+" "+n+" "+d;
  if((num>=600 && num<=699) || /^عروض/.test(c) || /^عرض/.test(t) || /^بكج/.test(t) || /^باقة/.test(t)) return "offers";
  if(c==="السناك والعربات") return "snacks";
  if(c==="تجهيز الحفلات والمناسبات") return "events";
  if(c==="الطاولات والكراسي والشخصيات" || /طاول|كرسي|كراسي|شخصية|شخصيات/.test(blob)) return "rentals";
  if(c==="بنود أخرى") return "other";
  return "bouncies";
}
function priceOf(p){
  const nums=[];
  // السعر الأساسي الصحيح حسب نوع المنتج
  if(Number(p.baseDecorPrice)>0) nums.push(Number(p.baseDecorPrice));
  if(Array.isArray(p.snackPackages) && p.snackPackages.length){
    p.snackPackages.forEach(o=>{ if(Number(o.price)>0) nums.push(Number(o.price)); });
  }
  if(p.packagePrices && typeof p.packagePrices==="object"){
    Object.values(p.packagePrices).forEach(v=>{ if(Number(v)>0) nums.push(Number(v)); });
  }
  ["priceOneDay","priceTwoDays","baseTotal"].forEach(k=>{
    if(Number(p[k])>0) nums.push(Number(p[k]));
  });
  // سعر الوحدة مثل 5 ر.ق لا يظهر كسعر أساسي إلا إذا ما في أي سعر ثاني
  if(!nums.length && Number(p.unitPrice)>0) nums.push(Number(p.unitPrice));
  if(!nums.length && Number(p.piecePrice)>0) nums.push(Number(p.piecePrice));
  return nums.length ? Math.min(...nums) : 0;
}
function img(p){return p.image || "order-ad.jpg"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shortText(s,n=42){s=String(s||""); return s.length>n?s.slice(0,n)+"...":s}
function groupObj(){return groups.find(g=>g.id===current)||groups[0]}
function groupProducts(){const g=groupObj();return PRODUCTS.filter(p=>g.match(p))}
function uniqueCats(){return [...new Set(groupProducts().map(p=>p.category).filter(Boolean))].slice(0,20)}

function init(){
  nav.innerHTML = groups.map(g=>`<button class="${g.id===current?'active':''}" onclick="setGroup('${g.id}')">${g.icon} ${g.title}</button>`).join("");
  catIcons.innerHTML = groups.filter(g=>g.id!=="all").map(g=>{
    const count=PRODUCTS.filter(p=>g.match(p)).length;
    return `<button class="cat-card" onclick="setGroup('${g.id}')"><span class="ico">${g.icon}</span><b>${g.title}</b><small>${count} بند</small></button>`;
  }).join("");
  renderChips(); renderProducts(); updateCart();
}
function setGroup(id){
  current=id; currentCat="";
  const g=groupObj();
  sectionTitle.textContent = g.id==="all" ? "مختارات VIP" : g.title;
  sectionDesc.textContent = g.desc;
  init();
  setTimeout(()=>document.getElementById("products").scrollIntoView({behavior:"smooth",block:"start"}),50);
}
function renderChips(){
  const cats=uniqueCats();
  chips.innerHTML = `<button class="chip ${!currentCat?'active':''}" onclick="currentCat='';renderChips();renderProducts()">الكل</button>` +
    cats.map(c=>`<button class="chip ${c===currentCat?'active':''}" onclick='currentCat=${JSON.stringify(c)};renderChips();renderProducts()'>${esc(c)}</button>`).join("");
}
function renderProducts(){
  const term=(q.value||"").trim().toLowerCase();
  let list=groupProducts().filter(p=>!currentCat || p.category===currentCat);
  if(term){
    list=list.filter(p=>[p.number,p.name,p.category,p.type,p.details,p.age].join(" ").toLowerCase().includes(term));
  }
  if(current==="all") list=list.slice(0,40);
  products.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">لا توجد منتجات مطابقة.</div>`;
}
function card(p){
  return `<article class="card">
    <span class="badge">#${esc(p.number||p.id)}</span>
    <div class="pic" onclick="openDetail(${Number(p.id)})"><img src="${esc(img(p))}" loading="lazy" onerror="this.src='order-ad.jpg'"></div>
    <div class="card-body">
      <h3>${esc(p.name)}</h3>
      <div class="meta"><span>${esc(shortText(p.type||p.category,16))}</span><span>${esc(shortText(p.age||p.durationOneDay||"حسب الطلب",18))}</span></div>
      <div class="price">${priceOf(p)} ر.ق</div>
      <div class="card-actions">
        <button class="details-btn" onclick="openDetail(${Number(p.id)})">تفاصيل</button>
        <button class="add-btn" onclick="quickAdd(${Number(p.id)})">+</button>
      </div>
    </div>
  </article>`;
}

function productOptions(p){
  const opts=[];
  if(Number(p.baseDecorPrice)>0){
    opts.push({label:"ديكور فقط", price:Number(p.baseDecorPrice), note:"السعر الأساسي"});
  }
  if(p.decorPackages && typeof p.decorPackages==="object" && Number(p.baseDecorPrice)>0){
    Object.entries(p.decorPackages).forEach(([kids,extra])=>{
      const total=Number(p.baseDecorPrice)+Number(extra||0);
      opts.push({label:`باقة ${kids} طفل`, price:total, note:"ديكور + باقة أطفال"});
    });
  }
  if(Array.isArray(p.snackPackages)){
    p.snackPackages.forEach(o=>{
      if(Number(o.price)>0){
        opts.push({label:`${o.kids||o.children||""} طفل`, price:Number(o.price), note:o.note||"باقة سناك"});
      }
    });
  }
  if(p.packagePrices && typeof p.packagePrices==="object"){
    Object.entries(p.packagePrices).forEach(([k,v])=>{
      if(Number(v)>0) opts.push({label:k, price:Number(v), note:"باقة"});
    });
  }
  if(Number(p.priceOneDay)>0) opts.push({label:p.durationOneDay||"يوم واحد", price:Number(p.priceOneDay), note:""});
  if(Number(p.priceTwoDays)>0 && Number(p.priceTwoDays)!==Number(p.priceOneDay)) opts.push({label:p.durationTwoDays||"يومين", price:Number(p.priceTwoDays), note:""});
  if(!opts.length && Number(p.unitPrice)>0) opts.push({label:"سعر الوحدة", price:Number(p.unitPrice), note:""});
  if(!opts.length && Number(p.piecePrice)>0) opts.push({label:"سعر القطعة", price:Number(p.piecePrice), note:""});
  if(!opts.length) opts.push({label:"حسب الطلب", price:0, note:""});
  // إزالة التكرار بنفس السعر والاسم
  const seen=new Set();
  return opts.filter(o=>{const k=o.label+"|"+o.price; if(seen.has(k))return false; seen.add(k); return true;});
}
function niceVal(v){
  if(v==null || v==="") return "";
  if(Array.isArray(v)){
    return v.map(x=>{
      if(typeof x==="object") return Object.entries(x).map(([k,val])=>`${k}: ${val}`).join(" - ");
      return String(x);
    }).join("<br>");
  }
  if(typeof v==="object"){
    const parts=Object.entries(v).filter(([k,val])=>val!==""&&val!=null).map(([k,val])=>`${k}: ${val}`);
    return parts.join("<br>");
  }
  return String(v);
}
function infoRows(p){
  const rows=[];
  const map=[
    ["القسم","category"],["النوع","type"],["العمر","age"],["المدة","durationOneDay"],["المدة الثانية","durationTwoDays"],
    ["الطول","length"],["العرض","width"],["الارتفاع","height"],["المقاس","measurements"],
    ["ألوان","colors"],["محتويات العرض","offerIncludes"],["السناك","snackType"],["المرفق","included"],["الشروط","packageConditions"]
  ];
  map.forEach(([label,key])=>{
    const val=niceVal(p[key]);
    if(val) rows.push(`<div><b>${label}</b><br>${val}</div>`);
  });
  return rows.join("");
}
function openDetail(id){
  const p=PRODUCTS.find(x=>Number(x.id)===Number(id)||Number(x.number)===Number(id)); if(!p)return;
  currentProduct=p; qty=1; selectedOption=productOptions(p)[0];
  const opts=productOptions(p);
  detailPanel.innerHTML = `<button class="close" onclick="closeSheets()">×</button>
    <img class="detail-img" src="${esc(img(p))}" onerror="this.src='order-ad.jpg'">
    <h1>${esc(p.name)}</h1>
    <p class="sub">${esc(p.details||p.category||"")}</p>
    <div class="info-box"><h3>اختيار السعر / الباقة</h3><div class="options">
      ${opts.map((o,i)=>`<button class="opt ${i===0?'active':''}" onclick="selectOpt(${i})">${esc(o.label)}<br>${o.price} ر.ق</button>`).join("")}
    </div></div>
    <div class="info-box"><h3>بيانات ومعلومات المنتج</h3><div class="info-grid">${infoRows(p) || "<div>لا توجد معلومات إضافية</div>"}</div></div>
    <div class="info-box"><h3>ملاحظات الطلب</h3>
      <input class="field" id="custChild" placeholder="اسم الطفل / الثيم / اللون إن وجد">
      <textarea class="field" id="custNote" placeholder="أي ملاحظة إضافية للطلب"></textarea>
    </div>
    <div class="bottom-actions">
      <button class="primary" onclick="addCurrent()">أضف</button>
      <div class="qty"><button onclick="changeQty(-1)">−</button><span id="qtyText">1</span><button onclick="changeQty(1)">+</button></div>
    </div>`;
  detailSheet.classList.add("show");
}
function selectOpt(i){
  const opts=productOptions(currentProduct); selectedOption=opts[i];
  document.querySelectorAll(".opt").forEach((b,idx)=>b.classList.toggle("active",idx===i));
}
function changeQty(n){qty=Math.max(1,qty+n); const el=document.getElementById("qtyText"); if(el)el.textContent=qty}
function quickAdd(id){
  const p=PRODUCTS.find(x=>Number(x.id)===Number(id)||Number(x.number)===Number(id)); if(!p)return;
  const o=productOptions(p)[0];
  cart.push({id:p.id,number:p.number,name:p.name,img:img(p),option:o.label,price:o.price,qty:1,note:""});
  saveCart();
}
function addCurrent(){
  if(!currentProduct)return;
  const o=selectedOption||productOptions(currentProduct)[0];
  const note=[document.getElementById("custChild")?.value,document.getElementById("custNote")?.value].filter(Boolean).join(" - ");
  cart.push({id:currentProduct.id,number:currentProduct.number,name:currentProduct.name,img:img(currentProduct),option:o.label,price:o.price,qty,note});
  saveCart(); closeSheets(); openCart();
}
function saveCart(){localStorage.setItem("almalikaCleanCart",JSON.stringify(cart));updateCart()}
function updateCart(){
  const count=cart.reduce((s,x)=>s+Number(x.qty||1),0);
  const total=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);
  topCount.textContent=count; cartCount.textContent=count; cartTotal.textContent=total;
}
function openCart(){
  const total=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);
  cartPanel.innerHTML = `<button class="close" onclick="closeSheets()">×</button><h1>سلة الحجز</h1>
  ${cart.length ? cart.map((x,i)=>`<div class="cart-item"><img src="${esc(x.img)}" onerror="this.src='order-ad.jpg'"><div><b>${esc(x.name)}</b><small>${esc(x.option)} × ${x.qty}</small>${x.note?`<small>${esc(x.note)}</small>`:""}</div><button class="del" onclick="removeItem(${i})">حذف</button></div>`).join("") : `<div class="empty">السلة فارغة.</div>`}
  <div class="total"><span>الإجمالي</span><b>${total} ر.ق</b></div>
  <div class="info-box"><h3>بيانات الحجز</h3>
    <input class="field" id="custName" placeholder="الاسم">
    <input class="field" id="custPhone" placeholder="رقم الجوال">
    <input class="field" id="custArea" placeholder="المنطقة">
    <input class="field" id="custDate" placeholder="تاريخ الحجز">
    <textarea class="field" id="orderNote" placeholder="ملاحظات إضافية"></textarea>
  </div>
  <button class="primary" style="width:100%;margin-top:10px" onclick="sendWhats()">إرسال الطلب واتساب</button>`;
  cartSheet.classList.add("show");
}
function removeItem(i){cart.splice(i,1);saveCart();openCart()}
function sendWhats(){
  const lines=["طلب حجز من كتالوج الملكة",""];
  cart.forEach((x,i)=>lines.push(`${i+1}) #${x.number} ${x.name} - ${x.option} - ${x.price} ر.ق × ${x.qty}${x.note?" - "+x.note:""}`));
  const total=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);
  lines.push("",`الإجمالي: ${total} ر.ق`,"","بيانات العميل:",`الاسم: ${custName.value||""}`,`الجوال: ${custPhone.value||""}`,`المنطقة: ${custArea.value||""}`,`التاريخ: ${custDate.value||""}`,`ملاحظات: ${orderNote.value||""}`);
  location.href=`https://wa.me/${phone}?text=`+encodeURIComponent(lines.join("\n"));
}
function closeSheets(){detailSheet.classList.remove("show");cartSheet.classList.remove("show")}
detailSheet.addEventListener("click",e=>{if(e.target===detailSheet)closeSheets()});
cartSheet.addEventListener("click",e=>{if(e.target===cartSheet)closeSheets()});
init();
</script>

<script id="almalika-clean-v3-details-gallery-script">
(function(){
  // حفظ الدوال الأصلية إن وجدت
  const oldNiceVal = window.niceVal;
  const oldInfoRows = window.infoRows;
  const oldProductOptions = window.productOptions;
  const oldOpenDetail = window.openDetail;

  window.niceVal = function(v){
    if(v==null || v==="") return "";
    if(Array.isArray(v)){
      return v.map(x=>{
        if(x==null) return "";
        if(typeof x==="object") {
          const preferred = [];
          if(x.kids || x.children) preferred.push((x.kids||x.children)+" طفل");
          if(x.price) preferred.push(x.price+" ر.ق");
          if(x.note) preferred.push(x.note);
          if(preferred.length) return preferred.join(" - ");
          return Object.entries(x).map(([k,val])=>`${k}: ${val}`).join(" - ");
        }
        return String(x);
      }).filter(Boolean).join("<br>");
    }
    if(typeof v==="object"){
      return Object.entries(v)
        .filter(([k,val])=>val!==""&&val!=null && !(typeof val==="object" && !Array.isArray(val)))
        .map(([k,val])=>`${k}: ${val}`)
        .join("<br>");
    }
    return String(v);
  };

  window.productGallery = function(p){
    const list = [];
    if(p && p.image) list.push(p.image);
    if(p && Array.isArray(p.decorGallery)) {
      p.decorGallery.forEach(x=>{ if(x && !list.includes(x)) list.push(x); });
    }
    // صور محتملة بنفس رقم المنتج: لا تسبب ضرر إذا غير موجودة، لكن لا نعرضها إلا كـ thumbnails بعد تحميلها لاحقًا.
    return list;
  };

  window.switchDetailImage = function(src, el){
    const main = document.querySelector(".detail-img");
    if(main) main.src = src;
    document.querySelectorAll(".gallery-thumb").forEach(x=>x.classList.remove("active"));
    if(el) el.classList.add("active");
  };

  window.productOptions = function(p){
    const opts=[];
    const add=(label,price,note)=>{
      price=Number(price||0);
      if(!label) return;
      const key=label+"|"+price;
      if(opts.some(o=>o.key===key)) return;
      opts.push({label,price,note:note||"",key});
    };

    if(Number(p.baseDecorPrice)>0) add("ديكور فقط", p.baseDecorPrice, "السعر الأساسي");
    if(p.decorPackages && typeof p.decorPackages==="object" && Number(p.baseDecorPrice)>0){
      Object.entries(p.decorPackages).forEach(([kids,extra])=>{
        add(`باقة ${kids} طفل`, Number(p.baseDecorPrice)+Number(extra||0), "ديكور + باقة أطفال");
      });
    }

    if(Array.isArray(p.snackPackages)){
      p.snackPackages.forEach(o=>{
        if(o && Number(o.price)>0) add(`${o.kids||o.children||""} طفل`, o.price, o.note||"مدة الخدمة 3 ساعات مع موظفة");
      });
    }

    if(p.packagePrices && typeof p.packagePrices==="object"){
      Object.entries(p.packagePrices).forEach(([k,v])=>{ if(Number(v)>0) add(k,v,"باقة"); });
    }

    // لا نكرر يوم واحد إذا موجود ديكور فقط بنفس السعر
    if(Number(p.priceOneDay)>0) add(p.durationOneDay||"يوم واحد", p.priceOneDay, "");
    if(Number(p.priceTwoDays)>0 && Number(p.priceTwoDays)!==Number(p.priceOneDay)) add(p.durationTwoDays||"يومين", p.priceTwoDays, "");
    if(!opts.length && Number(p.unitPrice)>0) add("سعر الوحدة", p.unitPrice, "");
    if(!opts.length && Number(p.piecePrice)>0) add("سعر القطعة", p.piecePrice, "");
    if(!opts.length) add("حسب الطلب",0,"");

    return opts.map(({key,...o})=>o);
  };

  window.infoRows = function(p){
    const rows=[];
    const add=(label,val,full)=>{
      val=niceVal(val);
      if(!val) return;
      rows.push(`<div class="${full?'full':''}"><b>${label}</b><br>${val}</div>`);
    };

    add("القسم", p.category);
    add("النوع", p.type);
    add("العمر", p.age);
    add("المدة", p.durationOneDay);
    if(p.durationTwoDays && p.durationTwoDays!==p.durationOneDay) add("المدة الثانية", p.durationTwoDays);
    add("المقاس", p.measurements || [p.length,p.width,p.height].filter(Boolean).join(" × "));
    add("ألوان", p.colors, true);
    add("السناك", p.snackType, true);
    add("المرفق", p.included);
    add("محتويات العرض", p.offerIncludes, true);
    add("ملاحظات", p.notes, true);
    add("الشروط", p.packageConditions, true);

    // عرض الباقات بشكل منظم في البيانات أيضًا
    if(Array.isArray(p.snackPackages)) add("باقات السناك", p.snackPackages, true);
    if(p.decorPackages && typeof p.decorPackages==="object"){
      const base=Number(p.baseDecorPrice||0);
      const txt=Object.entries(p.decorPackages).map(([kids,extra])=>`باقة ${kids} طفل: ${base+Number(extra||0)} ر.ق`).join("<br>");
      add("باقات الديكور", txt, true);
    }
    return rows.join("");
  };

  window.openDetail = function(id){
    const p=(window.PRODUCTS||[]).find(x=>Number(x.id)===Number(id)||Number(x.number)===Number(id)); 
    if(!p)return;
    currentProduct=p; qty=1; selectedOption=productOptions(p)[0];
    const opts=productOptions(p);

    const galleryHtml = gallery.length>1 ? `<div class="gallery-strip">${gallery.map((g,i)=>`<img class="gallery-thumb ${i===0?'active':''}" src="${esc(g)}" onclick="switchDetailImage('${esc(g)}',this)" onerror="this.style.display='none'">`).join("")}</div>` : "";
    const missingNote = gallery.length<=1 ? `<div class="clean-warning">ملاحظة: إذا كان لهذا المنتج صور اختيار إضافية في النسخة القديمة ولم تظهر هنا، فهذا يعني أنها غير موجودة داخل ملف البيانات الحالي ويجب نقل روابطها لاحقًا للبيانات.</div>` : "";

    detailPanel.innerHTML = `<button class="close" onclick="closeSheets()">×</button>
      <img class="detail-img" src="${esc(gallery[0]||img(p))}" onerror="this.src='order-ad.jpg'">
      ${galleryHtml}

      <p class="sub">${esc(p.details||p.category||"")}</p>
      ${missingNote}
      <div class="info-box"><h3>اختيار السعر / الباقة</h3><div class="options">
        ${opts.map((o,i)=>`<button class="opt ${i===0?'active':''}" onclick="selectOpt(${i})">${esc(o.label)}<br>${Number(o.price||0)} ر.ق${o.note?`<small class="package-note">${esc(o.note)}</small>`:""}</button>`).join("")}
      </div></div>
      <div class="info-box"><h3>بيانات ومعلومات المنتج</h3><div class="info-grid">${infoRows(p) || "<div>لا توجد معلومات إضافية</div>"}</div></div>
      <div class="info-box"><h3>ملاحظات الطلب</h3>

      </div>
      <div class="bottom-actions">
        <button class="primary" onclick="addCurrent()">أضف</button>
        <div class="qty"><button onclick="changeQty(-1)">−</button><span id="qtyText">1</span><button onclick="changeQty(1)">+</button></div>
      </div>`;
    detailSheet.classList.add("show");
  };
})();
</script>

<style id="almalika-clean-v10-image-fallback-style">
/* V10: لا نخفي الصورة قبل تجربة امتدادات الملفات القديمة */

<script id="almalika-clean-v10-image-fallback-script">
(function(){
  function esc10(s){
    return (window.esc ? window.esc(s) : String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])));
  }

  window.imgCandidates = function(p){
    const list = [];
    const add = (x)=>{
      if(!x) return;
      x = String(x).trim();
      if(x && !list.includes(x)) list.push(x);
    };
    const n = p && (p.number || p.id);
    const original = p && p.image;
    add(original);

    // جرّب نفس رقم المنتج بكل امتدادات الصور؛ هذا يحل مشكلة jpeg/jpg في العروض والباكجات
    if(n){
      ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"].forEach(ext=>add(`${n}.${ext}`));
      // لبعض الصور القديمة لو كانت بصيغة رقم-1
      ["jpg","jpeg","png","webp"].forEach(ext=>add(`${n}-1.${ext}`));
    }

    // إذا كانت الصورة الأصلية لها اسم، جرب نفس الاسم بامتدادات أخرى
    if(original && original.includes(".")){
      const stem = original.replace(/\.[^.]+$/,"");
      ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"].forEach(ext=>add(`${stem}.${ext}`));
    }

    return list;
  };

  window.tryNextImg = function(imgEl){
    if(!imgEl) return;
    let tries = [];
    try { tries = JSON.parse(imgEl.dataset.tries || "[]"); } catch(e){ tries=[]; }
    let idx = Number(imgEl.dataset.tryIndex || 0);

    idx += 1;
    if(idx < tries.length){
      imgEl.dataset.tryIndex = String(idx);
      imgEl.src = tries[idx];
      return;
    }

    // بعد تجربة كل الامتدادات فقط نخفي الكرت أو الصورة الفارغة
    const card = imgEl.closest && imgEl.closest(".card");
    if(card){ card.classList.add("img-missing"); card.remove(); return; }

    const thumb = imgEl.closest && imgEl.closest(".decorThumb,.gallery-thumb");
    if(thumb){ thumb.classList.add("img-missing"); thumb.remove(); return; }

    imgEl.style.display = "none";
  };

  window.cardImgHtml = function(p){
    const tries = imgCandidates(p);
    if(!tries.length) return "";
    const first = tries[0];
    return `<img src="${esc10(first)}" data-tries='${esc10(JSON.stringify(tries))}' data-try-index="0" loading="lazy" onerror="tryNextImg(this)">`;
  };

  // بديل markImgMissing من V9: لا نحذف مباشرة، نجرب الامتدادات أولاً
  window.markImgMissing = function(imgEl){
    tryNextImg(imgEl);
  };

  window.hideBrokenThumb = function(imgEl){
    tryNextImg(imgEl);
  };

  // صور الديكور الإضافية: جرّب jpg/jpeg/png/webp لكل صورة قبل إخفائها
  const oldGalleryV10 = window.oldGalleryHtml;
  window.oldGalleryHtml = function(p){
    if(!oldGalleryV10) return "";
    let html = oldGalleryV10(p);
    // عدّل onerror القديم ليستخدم tryNextImg
    html = html.replaceAll('onerror="hideBrokenThumb(this)"', 'onerror="tryNextImg(this)"');
    // أضف data-tries للصور التي داخل thumbnails بعد إنشاء DOM لاحقاً عبر حدث load في openDetail
    return html;
  };

  // إعادة رسم الكرت من نفس بيانات V8/V9 مع fallback للصور
  window.card = function(p){
    if(!p) return "";
    const price = (typeof priceOf === "function") ? priceOf(p) : (p.priceOneDay||p.baseDecorPrice||p.unitPrice||0);
    const tag1 = String(p.category || p.type || "منتج").slice(0,20);
    const tag2 = String(p.durationOneDay || p.age || "حسب الطلب").slice(0,20);
    const mini = (typeof v8ProductMini === "function") ? v8ProductMini(p) : (p.details || "");
    const priceLabel = (typeof v8PriceLabel === "function") ? v8PriceLabel(p) : "يبدأ من";
    const imgHtml = cardImgHtml(p);
    if(!imgHtml) return "";
    return `<article class="card">
      <span class="badge">#${esc10(p.number||p.id)}</span>
      <div class="pic" onclick="openDetail(${Number(p.id)})">${imgHtml}</div>
      <div class="card-body">
        <h3>${esc10(p.name)}</h3>
        <p class="v8-mini">${esc10(String(mini).replace(/\s+/g," ").slice(0,96))}</p>
        <div class="meta"><span>${esc10(tag1)}</span><span>${esc10(tag2)}</span></div>
        <div class="price"><span>${esc10(priceLabel)}</span>${price} ر.ق</div>
        <div class="card-actions">
          <button class="details-btn" onclick="openDetail(${Number(p.id)})">تفاصيل</button>
          <button class="add-btn" onclick="quickAdd(${Number(p.id)})">+</button>
        </div>
      </div>
    </article>`;
  };

  // في تفاصيل المنتج: الصورة الرئيسية تجرب كل الامتدادات قبل إخفائها
  const prevOpenV10 = window.openDetail;
  window.openDetail = function(id){
    if(prevOpenV10) prevOpenV10(id);
    setTimeout(function(){
      const p=(window.PRODUCTS||[]).find(x=>Number(x.id)===Number(id)||Number(x.number)===Number(id));
      if(!p) return;

      const main = detailPanel && detailPanel.querySelector(".detail-img");
      if(main){
        const tries = imgCandidates(p);
        main.dataset.tries = JSON.stringify(tries);
        main.dataset.tryIndex = "0";
        main.onerror = function(){ tryNextImg(this); };
      }

      // thumbnails: أضف مرشحات امتداد لكل صورة
      detailPanel.querySelectorAll(".decorThumb img,.gallery-thumb").forEach(function(im){
        const src = im.getAttribute("src") || "";
        const stem = src.replace(/\.[^.]+$/,"");
        const tries = [];
        function add(x){ if(x && !tries.includes(x)) tries.push(x); }
        add(src);
        ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"].forEach(ext=>add(stem+"."+ext));
        im.dataset.tries = JSON.stringify(tries);
        im.dataset.tryIndex = "0";
        im.onerror = function(){ tryNextImg(this); };
      });
    },80);
  };

  // بعد الرسم شغّل إعادة الرسم حتى تظهر الصور المخفية سابقاً بعد تجربة الامتدادات
  setTimeout(function(){
    if(typeof renderProducts === "function") renderProducts();
  },150);
})();
</script>

    if(!currentProduct) return;

    if(document.getElementById("custChild")?.value) extras.push(document.getElementById("custChild").value);
    if(document.getElementById("custNote")?.value) extras.push(document.getElementById("custNote").value);
    if(addPrice>0) extras.push("إجمالي الإضافات: "+addPrice+" ر.ق");

    cart.push({id:currentProduct.id,number:currentProduct.number,name:currentProduct.name,img:img(currentProduct),option:o.label,price:Number(o.price||0)+addPrice,qty,note:extras.join(" - ")});

            <img id="v13MainImg" class="v13-main-img" src="${esc13(mainImg)}" onerror="tryNextImg?tryNextImg(this):this.style.display='none'">
            <h1 class="v13-title">${esc13(p.name)}</h1>
            <div class="v13-tags"><span>#${esc13(p.number||p.id)}</span><span>${esc13(p.category||"")}</span><span>${esc13(p.type||"")}</span></div>
            <div class="v13-intro">${esc13(p.details||"")}</div>
          </div>
          ${priceHtml(p)}
          ${isDecor ? `<div class="v13-section"><h3 class="v13-section-title">بيانات حجز الديكور</h3>
            <h4 class="v13-section-title" style="font-size:16px;margin-top:0">الشخصية / الثيم <span class="v13-required">مطلوب</span></h4>
            <div class="v13-help">اختر الشخصية من القائمة، ويتم تحميل الصورة الحقيقية تلقائياً من ويكيبيديا عند توفرها، ثم اكتب اسم الطفل على البنر.</div>
            <select id="v13Theme" class="v13-field"><option>حسب الطلب / ثيم خاص</option><option>أميرات</option><option>سبايدرمان</option><option>فروزن</option><option>يونيكورن</option><option>سيارات</option><option>تخرج</option><option>بيبي</option></select>
            <input id="custChild" class="v13-field" placeholder="اسم الطفل / الطفلة على البنر *">
            <textarea id="custNote" class="v13-field" placeholder="ملاحظات الثيم: العمر أو الاسم بالإنجليزي أو شخصية أخرى"></textarea>
          </div>
          <div class="v13-section"><h3 class="v13-section-title">اختيار ألوان البالونات 🎈</h3>${colorsHtml()}</div>
          ${snackHtml(p)}
          <div class="v13-total"><div>الإجمالي الحالي للديكور</div><div id="v13TotalAmount" class="amount">${Number(selectedOption?.price||0)} ر.ق</div><small id="v13TotalSub">الباقة: ${Number(selectedOption?.price||0)} ر.ق</small></div>
          ${addonsHtml(p)}` : ""}
          ${bookingHtml(p)}
        </main>
        ${isDecor ? galleryHtml(p) : ""}
      </div>
      <div class="bottom-actions v13-bottom">
        <button class="primary" onclick="addCurrent()">أضف للسلة 🛒</button>
        <div class="qty"><button onclick="changeQty(-1)">−</button><span id="qtyText">1</span><button onclick="changeQty(1)">+</button></div>
      </div>`;
    detailPanel.classList.add("v13-modal-wide");
    detailSheet.classList.add("show");
    setTimeout(v13UpdateTotal,60);
  };

  window.addCurrent=function(){
    if(!currentProduct) return;
    const total=v13UpdateTotal();
    const o=selectedOption||v13Options(currentProduct)[0]||productOptions(currentProduct)[0];
    const extras=[];
    const val=id=>document.getElementById(id)?.value||"";
    if(v13State.selectedShape) extras.push("شكل الديكور: "+v13State.selectedShape);
    if(val("v13Theme")) extras.push("الثيم: "+val("v13Theme"));
    if(v13State.color) extras.push("ألوان البالونات: "+v13State.color);
    if(v13State.tablePrice) extras.push("طاولات إضافية: "+v13State.tablePrice+" ر.ق");
    if(v13State.printPrice) extras.push("ملصقات الطاولات: "+v13State.printPrice+" ر.ق");
    if(v13State.snackPrice) extras.push("سناك الأطفال: "+v13State.snackPrice+" ر.ق");
    document.querySelectorAll(".v13-snack:checked").forEach(c=>extras.push("سناك: "+c.parentElement.textContent.trim()));
    if(val("custChild")) extras.push("اسم/ثيم: "+val("custChild"));
    if(val("custNote")) extras.push("ملاحظة: "+val("custNote"));
    cart.push({id:currentProduct.id,number:currentProduct.number,name:currentProduct.name,img:v13State.selectedImg||img(currentProduct),option:o.label,price:total,qty,note:extras.join(" - ")});
    saveCart(); closeSheets(); openCart();
  };

})();
</script>

function esc15(s){
  return (window.esc ? window.esc(s) : String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])));
}
function sec15(p){ return (typeof sectionOf==='function') ? sectionOf(p) : 'all'; }
function kind15(p){
  const s=sec15(p);
  if(s==='snacks') return 'snack';
  if(s==='events') return 'event';
  if(s==='bouncies') return 'bouncy';
  if(s==='tables') return 'rental';
  if(s==='offers') return 'offer';
  return 'other';
}
function isDecor15(p){ return kind15(p)==='event' || String(p.category||'').includes('تجهيز الحفلات') || String(p.type||'').includes('ديكور'); }
function todayISO15(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

window.v15OptionList=function(p){
  if(typeof productOptions==='function'){
    const opts=productOptions(p)||[];
    const seen=new Set();
    return opts.filter(o=>{const k=`${o.label}-${o.price}`; if(seen.has(k))return false; seen.add(k); return true;});
  }
  return [{id:'fixed',label:p.durationOneDay||'يوم واحد',price:Number(p.priceOneDay||p.baseDecorPrice||0),note:p.details||''}];
};

window.v15DecorGalleryFiles=function(p){
  let arr=[]; const add=x=>{ if(x && !arr.includes(x)) arr.push(x); };
  if(p.image) add(p.image);
  if(Array.isArray(p.decorGallery)) p.decorGallery.forEach(add);
  const n=p.number||p.id;
  if(n) for(let i=1;i<=18;i++) ['jpg','jpeg','png','webp'].forEach(ext=>add(`${n}-${i}.${ext}`));
  return arr;
};

window.selectDecorImage15=function(n,src,btn){
  const main=document.getElementById('v15MainImg');
  const side=document.getElementById('v15SideMain');
  const hidden=document.getElementById('decorImage_'+n);
  const label=document.getElementById('decorImageLabel_'+n);
  if(main) main.src=src;
  if(side) side.src=src;
  if(hidden) hidden.value=src;
  if(label && btn) label.value=btn.dataset.decorLabel||'الصورة الأساسية';
  document.querySelectorAll('.v15-thumb').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
};

window.enforceShinyBalloonLimit=function(n, changedEl){
  const checked=[...document.querySelectorAll(`input[name="balloon_${n}"].shinyBalloonInput:checked`)];
  if(checked.length>2){
    if(changedEl) changedEl.checked=false;
    alert('الألوان اللامعة فقط: يمكن اختيار لون واحد أو لونين كحد أقصى.');
    return false;
  }
  return true;
};

window.balloonColorHtml15=function(n){
  const shinySection = `<div class="shinyBalloonBox">
    <div class="shinyBalloonTitle">✨ الألوان اللامعة</div>
    <div class="colorSwatches shinyGrid">${(window.shinyBalloonColorsV15||[]).map(([name,img])=>`<label class="colorSwatch shiny"><input type="checkbox" class="shinyBalloonInput" name="balloon_${n}" value="${esc15(name)}" onchange="enforceShinyBalloonLimit(${n},this)"><span class="colorDot shinyDot" style="background-image:url('${img}');"></span><span class="shinyName">${esc15(name)}</span></label>`).join('')}</div>
    <div class="shinyHint">الألوان اللامعة: يمكن اختيار لون واحد أو لونين فقط كحد أقصى.</div>
  </div>`;
  return `<div class="balloonColorBox">
    ${shinySection}
    <div class="choiceBoxTitle">🎈 اختيار ألوان البالونات <span class="v15-required">مطلوب</span></div>
    <div class="colorSwatches">${(window.balloonColorsV15||[]).map(([name,color])=>`<label class="colorSwatch"><input type="checkbox" name="balloon_${n}" value="${esc15(name)}"><span class="colorDot" style="background:${color}"></span>${esc15(name)}</label>`).join('')}</div>
    <div class="addonHint">ألوان البالونات العادية مفتوحة: يمكن اختيار أكثر من لون بدون حد.</div>
  </div>`;
};

window.selectedBalloonColors15=function(n){
  return [...document.querySelectorAll(`input[name="balloon_${n}"]:checked`)].map(x=>x.value).join(' + ');
};

window.snackItemsHtml15=function(n){
  const items=['فشار','حلويات مشكلة','شيبس','مارشميلو','مياه صغيرة للأطفال','عصير صغير للأطفال'];
  return `<div class="snackChoiceBox" id="snackBox_${n}" data-product="${n}">

    <div class="miniCheckGrid">${items.map(x=>`<label class="miniCheck"><input type="checkbox" name="snackItem_${n}" value="${esc15(x)}" checked>${esc15(x)}</label>`).join('')}</div>
    <div class="addonHint">تمت إضافة المياه والعصير الصغير للأطفال ضمن السناك.</div>
  </div>`;
};
window.selectedSnackItems15=function(n){
  return [...document.querySelectorAll(`input[name="snackItem_${n}"]:checked, input[name="snack_${n}"]:checked, input[name="snacks_${n}"]:checked`)].filter(x=>!x.disabled).map(x=>x.value).join(' + ');
};

window.selectedDecorBasePrice15=function(n){
  const checked=document.querySelector(`input[name="opt_${n}"]:checked`);
  return Number(checked?.closest('.priceChoice')?.querySelector('b')?.textContent?.replace(/[^\d.]/g,'')||0);
};
window.selectedAddonCard15=function(n,type){
  const el=document.querySelector(`input[name="${type}_${n}"]:checked`);
  return {label:el?.value||'بدون', price:Number(el?.dataset?.price||0)};
};
window.updateDecorTotal15=function(n){
  const totalEl=document.getElementById('decorTotalAmount_'+n);
  const detailsEl=document.getElementById('decorTotalDetails_'+n);
  if(!totalEl) return 0;
  const base=selectedDecorBasePrice15(n);
  const tableAdd=selectedAddonCard15(n,'tableAddon');
  const stickerAdd=selectedAddonCard15(n,'stickerAddon');
  const total=base+Number(tableAdd.price||0)+Number(stickerAdd.price||0);
  totalEl.textContent=total.toLocaleString('en-US')+' ر.ق';
  if(detailsEl){
    const parts=[`الباقة: ${base.toLocaleString('en-US')} ر.ق`];
    if(tableAdd.price>0) parts.push(`الطاولات: ${tableAdd.price} ر.ق`);
    if(stickerAdd.price>0) parts.push(`الملصقات: ${stickerAdd.price} ر.ق`);
    detailsEl.textContent=parts.join(' + ');
  }
  return total;
};
window.decorBigTotalHtml15=function(n){
  setTimeout(()=>updateDecorTotal15(n),80);
  return `<div class="decorTotalBigBox"><div class="decorTotalTitle">الإجمالي الحالي للديكور</div><div class="decorTotalAmount" id="decorTotalAmount_${n}">0 ر.ق</div><div class="decorTotalDetails" id="decorTotalDetails_${n}">اختر الباقة والطاولات/الملصقات</div></div>`;
};
window.decorAddonsCardsHtml15=function(n){
  const tables=[
    ['none','بدون طاولات إضافية',0,'—'],
    ['cyl-1','طاولة أسطوانية',50,'عدد 1'],
    ['cyl-2','طاولتان أسطوانيتان',100,'عدد 2'],
    ['cyl-3','3 طاولات أسطوانية',150,'عدد 3']
  ];
  const stickers=[
    ['none','بدون ملصقات',0,'—'],
    ['st-1','ملصق طاولة',75,'عدد 1'],
    ['st-2','ملصقات طاولة',150,'عدد 2'],
    ['st-3','ملصقات طاولة',225,'عدد 3']
  ];
  const cards=(name,arr)=>arr.map((x,i)=>`<label class="addonMiniCard"><input type="radio" name="${name}_${n}" value="${esc15(x[1])}" data-price="${x[2]}" ${i===0?'checked':''} onchange="updateDecorTotal15(${n})"><span class="tableIcon">◯</span><b>${esc15(x[1])}</b><small>${esc15(x[3])}</small><strong>${x[2]} ر.ق</strong></label>`).join('');
  return `<details class="optionalDetails addonCardsDetails" open><summary>اختيار الطاولات والملصقات إذا وجدت</summary><div class="addonCardsBox"><div class="addonSectionTitle">طاولات أسطوانية إضافية</div><div class="addonMiniGrid">${cards('tableAddon',tables)}</div><div class="addonSectionTitle">ملصقات الطاولات</div><div class="addonMiniGrid">${cards('stickerAddon',stickers)}</div><div class="addonHint">اختياري: إذا لا يحتاج طاولات أو ملصقات، اترك الاختيار على “بدون”.</div></div></details>`;
};

window.priceChoiceHtml15=function(p){
  const n=p.number||p.id;
  const opts=v15OptionList(p);
  const decorMode=isDecor15(p);
  return `<div class="v15-box"><h3 class="v15-title">${decorMode?'اختيار باقة الديكور':'اختيار مدة الحجز والسعر'} <span class="v15-required">مطلوب</span></h3>
    <div class="priceChoiceGrid">${opts.map((o,i)=>{
      const labelHtml=decorMode?`<span class="pkgCountBadge">${String(o.id||'').includes('decor')?'ديكور':'عدد الأطفال'}</span><span class="pkgCountValue">${esc15(o.label)}</span>`:`<span>${esc15(o.label)}</span>`;
      return `<label class="priceChoice ${i===0?'active':''}"><input type="radio" name="opt_${n}" value="${esc15(o.id||i)}" ${i===0?'checked':''} onchange="document.querySelectorAll('.priceChoice').forEach(x=>x.classList.remove('active'));this.closest('.priceChoice').classList.add('active');updateDecorTotal15(${n})">${labelHtml}<b>${Number(o.price||0)} ر.ق</b>${o.note?`<small>${esc15(o.note)}</small>`:''}</label>`;
    }).join('')}</div></div>`;
};

window.decorBookingHtml15=function(p){
  const n=p.number||p.id;
  return `<div class="v15-box pink"><h3 class="v15-title">بيانات حجز الديكور</h3>
    <div class="bookingSimple compactBooking">
      <input type="date" id="date_${n}" min="${todayISO15()}">
      <select id="period_${n}"><option value="">اختار وقت التركيب 9 صباحاً إلى 5 مساءً</option><option>صباحاً</option><option>ظهراً</option><option>عصراً</option></select>
      <select id="occasion_${n}"><option value="">نوع المناسبة</option><option>عيد ميلاد</option><option>تخرج</option><option>استقبال مولود</option><option>فعالية مدرسية</option><option>خطوبة / مناسبة خاصة</option><option>أخرى</option></select>
      <select id="place_${n}"><option value="">مكان التنفيذ</option><option>منزل</option><option>قاعة</option><option>مدرسة / روضة</option><option>خارجي</option></select>
    </div>
    <div class="themeBox">
      <div class="choiceBoxTitle">🎭 الشخصية / الثيم <span class="v15-required">مطلوب</span></div>
      <div class="addonHint">اختر الشخصية من القائمة، ثم اكتب اسم الطفل على البنر.</div>
      <select class="v15-field" id="theme_${n}"><option>حسب الطلب / ثيم خاص</option><option>أميرات</option><option>سبايدرمان</option><option>فروزن</option><option>يونيكورن</option><option>سيارات</option><option>تخرج</option><option>بيبي</option></select>
      <input class="v15-field" id="child_${n}" placeholder="اسم الطفل / الطفلة على البنر *">
      <textarea class="v15-field" id="themeNote_${n}" placeholder="ملاحظات الثيم: العمر أو الاسم بالإنجليزي أو شخصية أخرى"></textarea>
    </div>
    ${balloonColorHtml15(n)}
    ${snackItemsHtml15(n)}
    ${decorBigTotalHtml15(n)}
    ${decorAddonsCardsHtml15(n)}
    <div class="workingHoursHint">⏰ صباحاً / ظهراً / عصراً — من 9 صباحاً إلى 5 مساءً — لا يقبل تاريخ سابق</div>
    <textarea class="v15-field" id="note_${n}" placeholder="ملاحظات مختصرة: مكان التركيب أو تفاصيل مهمة فقط"></textarea>
  </div>`;
};

window.v15GalleryHtml=function(p){
  const files=v15DecorGalleryFiles(p);
  if(!files.length) return '';
  const n=p.number||p.id;
  return `<aside class="v15-side"><img id="v15SideMain" class="v15-side-main" src="${esc15(files[0])}" onerror="this.style.display='none'">
    <h3>اختر شكل الديكور المناسب للزبون 🖼️</h3>
    <div class="v15-gallery">${files.map((src,i)=>`<button class="v15-thumb ${i===0?'active':''}" data-decor-label="${i===0?'الصورة الأساسية':'شكل '+i}" onclick="selectDecorImage15(${n},'${esc15(src)}',this)"><img src="${esc15(src)}" onerror="this.closest('.v15-thumb').remove()"><span>${i===0?'الصورة الأساسية':'شكل '+i}</span></button>`).join('')}</div>
    <input type="hidden" id="decorImage_${n}" value="${esc15(files[0]||p.image||'')}">
    <input type="hidden" id="decorImageLabel_${n}" value="الصورة الأساسية">
    <div class="addonHint">اضغط على صورة الشكل المطلوب، وسيتم حفظها داخل السلة ورسالة الحجز.</div>
  </aside>`;
};

window.v15ActionsHtml=function(p){
  const msg=encodeURIComponent(`استفسار عن المنتج رقم ${p.number||p.id} - ${p.name}`);
  return `<div class="v15-box pink"><div class="v15-actions">
    <button class="v15-close" onclick="closeSheets()">إغلاق</button>
    <button class="v15-cart" onclick="addCurrent()">احجز الآن وأضف للسلة</button>
    <a class="v15-wa" href="https://wa.me/${WA15}?text=${msg}" target="_blank">استفسار واتساب</a>
  </div></div>`;
};

window.openDetail=function(id){
  const p=(window.PRODUCTS||PRODUCTS||[]).find(x=>Number(x.id)===Number(id)||Number(x.number)===Number(id));
  if(!p) return;
  currentProduct=p;
  qty=1;
  selectedOption=v15OptionList(p)[0];
  const n=p.number||p.id;
  const mainImg=(typeof imgCandidates==='function' ? imgCandidates(p)[0] : (p.image||img(p)));
  const decor=isDecor15(p);
  detailPanel.classList.add('v15-panel');
  detailPanel.innerHTML=`<button class="close" onclick="closeSheets()">×</button>
    <div class="v15-layout">
      <main class="v15-main">
        <div class="v15-box pink">
          <img id="v15MainImg" class="v15-main-img" src="${esc15(mainImg)}" onerror="tryNextImg?tryNextImg(this):this.style.display='none'">
          <h1 class="v15-product-title">${esc15(p.name)}</h1>
          <div class="v15-tags"><span>#${esc15(n)}</span><span>${esc15(p.category||'')}</span><span>${esc15(p.type||'')}</span></div>
          <div class="v15-summary-row">
            <div class="v15-summary-cell">المقاس: ${esc15(p.measurements||[p.length,p.width,p.height].filter(Boolean).join('×')||'حسب الطلب')}</div>
            <div class="v15-summary-cell">النوع: ${esc15(p.type||'حسب الطلب')}</div>
            <div class="v15-summary-cell">السعر: ${Number((v15OptionList(p)[0]||{}).price||0)} ر.ق</div>
          </div>
          <div class="v15-desc">${esc15(p.details||'')}</div>
        </div>
        ${priceChoiceHtml15(p)}
        ${decor ? decorBookingHtml15(p) : ''}
        ${!decor ? (typeof v12Data==='function'?v12Data(p):'') : ''}
        ${v15ActionsHtml(p)}
      </main>
      ${decor ? v15GalleryHtml(p) : ''}
    </div>
    <div class="bottom-actions v15-bottom">
      <button class="primary" onclick="addCurrent()">أضف للسلة 🛒</button>
      <div class="qty"><button onclick="changeQty(-1)">−</button><span id="qtyText">1</span><button onclick="changeQty(1)">+</button></div>
    </div>`;
  detailSheet.classList.add('show');
  setTimeout(()=>updateDecorTotal15(n),100);
};

window.addCurrent=function(){
  if(!currentProduct) return;
  const p=currentProduct, n=p.number||p.id;
  const selected=document.querySelector(`input[name="opt_${n}"]:checked`);
  const opt=v15OptionList(p).find(o=>String(o.id||'')===String(selected?.value||'')) || v15OptionList(p)[0] || selectedOption;
  const tableAdd=selectedAddonCard15(n,'tableAddon');
  const stickerAdd=selectedAddonCard15(n,'stickerAddon');
  const base=Number(opt?.price||0);
  const total=isDecor15(p) ? base+Number(tableAdd.price||0)+Number(stickerAdd.price||0) : base;
  const noteParts=[];
  const gv=id=>document.getElementById(id)?.value||'';
  if(gv('date_'+n)) noteParts.push('التاريخ: '+gv('date_'+n));
  if(gv('period_'+n)) noteParts.push('الوقت: '+gv('period_'+n));
  if(gv('occasion_'+n)) noteParts.push('المناسبة: '+gv('occasion_'+n));
  if(gv('place_'+n)) noteParts.push('المكان: '+gv('place_'+n));
  if(isDecor15(p)){
    noteParts.push('شكل الديكور: '+(gv('decorImageLabel_'+n)||'الصورة الأساسية'));
    if(gv('theme_'+n)) noteParts.push('الثيم: '+gv('theme_'+n));
    if(gv('child_'+n)) noteParts.push('اسم البنر: '+gv('child_'+n));
    const colors=selectedBalloonColors15(n);
    if(colors) noteParts.push('ألوان البالونات: '+colors);
    const snacks=selectedSnackItems15(n);
    if(snacks) noteParts.push('السناك: '+snacks);
    if(tableAdd.price>0) noteParts.push('الطاولات: '+tableAdd.label+' = '+tableAdd.price+' ر.ق');
    if(stickerAdd.price>0) noteParts.push('الملصقات: '+stickerAdd.label+' = '+stickerAdd.price+' ر.ق');
    if(gv('themeNote_'+n)) noteParts.push('ملاحظات الثيم: '+gv('themeNote_'+n));
  }
  if(gv('note_'+n)) noteParts.push('ملاحظات: '+gv('note_'+n));
  cart.push({
    id:p.id, number:p.number, name:p.name, img:gv('decorImage_'+n)||img(p),
    option:opt?.label||'حسب الطلب', price:total, qty, note:noteParts.join(' - ')
  });
  saveCart(); closeSheets(); openCart();
};

})();
</script>
<!-- ===== END ALMALIKA CLEAN V15 MATCH DESKTOP DATA PROCEDURES ===== -->
