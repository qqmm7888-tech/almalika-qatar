<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الملكة | كتالوج الجوال</title>
<script src="almalika-data-v2.js"></script>
<style>
:root{--b:#7b1230;--p:#f52f86;--g:#d4af37;--bg:#fff7fb;--ink:#24141b;--muted:#786873;--line:#f0c8da;--green:#22c55e}
*{box-sizing:border-box}
html{background:#f7eef3;overflow-x:hidden}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);overflow-x:hidden}
@media(min-width:760px){body{width:430px;margin:auto;box-shadow:0 0 60px rgba(123,18,48,.15);min-height:100vh}}
a,button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0}
.top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:50;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.logo{font-size:27px;font-weight:900;color:var(--b);white-space:nowrap}
.head-actions{display:flex;gap:7px}
.pill{height:38px;border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:5px;font-weight:900;font-size:12px}
.whats{background:var(--green);color:#fff}.cartpill{background:#fff;border:1px solid var(--line);color:var(--b)}
.nav{display:flex;gap:8px;overflow:auto;padding:0 12px 10px;scroll-snap-type:x proximity}
.nav::-webkit-scrollbar,.catrow::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--b);border-radius:16px;padding:10px 13px;font-weight:900;font-size:12px;scroll-snap-align:start}
.nav button.active{background:linear-gradient(135deg,var(--p),var(--b));color:#fff;border-color:transparent}
.searchbox{padding:10px 12px;display:grid;grid-template-columns:1fr 90px;gap:8px;background:#fff;border-bottom:1px solid #f4d9e6}
.searchbox input,.searchbox select{height:44px;border:1px solid var(--line);border-radius:15px;padding:0 12px;background:#fbf6f9;color:var(--b);font-weight:800;min-width:0}
.hero{padding:12px}
.hero img{width:100%;height:170px;object-fit:cover;border-radius:22px;border:1px solid #f1d2df;box-shadow:0 14px 35px rgba(123,18,48,.10)}
.section-title{padding:8px 14px 6px;text-align:right}
.section-title h2{font-size:21px;margin:0 0 4px;color:var(--ink)}
.section-title p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.catrow{display:flex;gap:10px;overflow:auto;padding:10px 12px 16px}
.catcard{flex:0 0 126px;min-height:135px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fff6db);border-radius:22px;padding:14px 10px;text-align:center;box-shadow:0 10px 24px rgba(123,18,48,.08)}
.catcard .ico{width:55px;height:55px;margin:0 auto 10px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:27px}
.catcard b{display:block;font-size:15px;line-height:1.35;color:#2a1830}.catcard small{display:block;margin-top:8px;font-weight:900;color:var(--b)}
.chips{display:flex;gap:7px;overflow:auto;padding:6px 12px 12px}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--b);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}
.chip.active{background:var(--b);color:#fff}
.products{display:grid;gap:12px;padding:0 12px 95px}
.card{display:grid;grid-template-columns:118px 1fr;background:#fff;border:1px solid #efd0df;border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(35,21,27,.08);position:relative;min-height:160px}
.num{position:absolute;top:8px;right:8px;background:var(--p);color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;z-index:2}
.pic{background:#fff8ec;padding:8px;display:grid;place-items:center}
.pic img{width:100%;height:142px;object-fit:contain}
.info{padding:12px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.info h3{font-size:14.5px;line-height:1.45;margin:0;color:#23151b}
.meta{display:flex;gap:4px;flex-wrap:wrap}
.meta span{font-size:9.5px;border:1px solid rgba(212,175,55,.45);background:#fff8e6;color:var(--b);border-radius:999px;padding:4px 6px;font-weight:800}
.price{margin-top:auto;background:#fff6dc;border:1px solid rgba(212,175,55,.45);border-radius:13px;padding:6px 8px;font-weight:900;color:#111}
.price small{display:block;color:#8a6a15;font-size:9px}.price b{font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.actions button{height:34px;border-radius:12px;font-size:11px;font-weight:900;color:#fff}
.details{background:linear-gradient(135deg,var(--p),var(--b))}
.add{background:#21151b}
.empty{text-align:center;padding:30px 15px;color:var(--muted);font-weight:900}
.cartbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:calc(100% - 18px);max-width:410px;z-index:80}
.cartbar button{width:100%;height:54px;border-radius:20px;background:linear-gradient(135deg,#8b1d49,#2b101a);color:#fff;font-weight:900;font-size:14px;box-shadow:0 14px 35px rgba(0,0,0,.20)}
.sheet{position:fixed;inset:0;background:rgba(20,14,18,.55);z-index:100;display:none;align-items:flex-end}
.sheet.show{display:flex}
.panel{width:100%;max-width:430px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:14px;box-shadow:0 -20px 50px rgba(0,0,0,.25)}
.close{position:sticky;top:0;margin-inline-start:auto;width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;font-size:20px;z-index:3}
.detail-img{width:100%;height:245px;object-fit:contain;background:#fff8ec;border-radius:20px;border:1px solid #f1d2df}
.panel h2{font-size:20px;line-height:1.45;margin:10px 0;color:var(--ink)}
.box{border:1px solid var(--line);background:#fffafc;border-radius:18px;padding:11px;margin:9px 0}
.box label{display:block;font-size:12px;color:var(--b);font-weight:900;margin-bottom:6px}
.box input,.box select,.box textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:#fff;font-weight:800;color:var(--ink)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;text-align:center;color:var(--b);font-weight:900}
.opt.active{border:2px solid var(--p);background:#fff4f9}
.primary{width:100%;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:900;font-size:15px;margin-top:8px}
.secondary{width:100%;height:48px;border-radius:16px;background:var(--green);color:#fff;font-weight:900;font-size:14px;margin-top:8px}
.cart-item{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:8px;margin:8px 0;background:#fffafc}
.cart-item img{width:62px;height:62px;object-fit:cover;border-radius:14px;background:#fff8ec}
.cart-item b{font-size:13px}.cart-item small{display:block;color:var(--muted);line-height:1.5}.del{background:#ffe4ed;color:var(--b);border-radius:12px;padding:8px;font-weight:900}
.total{display:flex;justify-content:space-between;align-items:center;background:#fff6dc;border:1px solid rgba(212,175,55,.55);border-radius:16px;padding:12px;font-weight:900;margin-top:10px}
.footer-note{font-size:11px;color:#7b6670;line-height:1.7;text-align:center;padding:10px 0}
</style>
</head>
<body>
<header class="top">
  <div class="head">
    <div class="logo">الملكة 👑</div>
    <div class="head-actions">
      <a class="pill whats" href="https://wa.me/97433317720">واتساب</a>
      <button class="pill cartpill" onclick="openCart()">السلة <span id="cartCount">0</span></button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<div class="searchbox">
  <input id="q" placeholder="ابحث بالرقم أو الاسم أو القسم..." oninput="renderProducts()">
  <select id="sort" onchange="renderProducts()"><option value="">ترتيب</option><option value="price">الأقل سعراً</option><option value="num">بالرقم</option></select>
</div>
<section class="hero"><img src="order-ad.jpg" alt="الملكة"></section>
<section class="section-title"><h2>الأقسام الرئيسية</h2><p>اختر القسم ثم أضف المنتجات للسلة، وبعدها أرسل الطلب واتساب.</p></section>
<div class="catrow" id="catrow"></div>
<div class="chips" id="chips"></div>
<section class="products" id="products"></section>
<div class="cartbar"><button onclick="openCart()">🛒 سلة الحجز: <span id="barCount">0</span> بند — <span id="barTotal">0</span> ر.ق</button></div>

<div class="sheet" id="detailSheet"><div class="panel" id="detailPanel"></div></div>
<div class="sheet" id="cartSheet"><div class="panel" id="cartPanel"></div></div>

<script>
const PRODUCTS = window.PRODUCTS || [];
const GROUPS = [
 {id:'all',label:'الرئيسية',icon:'👑',match:p=>true},
 {id:'bounce',label:'النطاطيات والزحلاقيات',icon:'🏰',match:p=>/(زحلاقيات|نطاطيات|صابونية|النطاطيات|الزحلاقيات|الملاعب)/.test(p.category||'')},
 {id:'snack',label:'السناك والعربات',icon:'🍿',match:p=>/(السناك|العربات)/.test(p.category||'')},
 {id:'decor',label:'تجهيز الحفلات',icon:'🎈',match:p=>/(تجهيز الحفلات|الحفلات والمناسبات)/.test(p.category||'') && !String(p.category||'').startsWith('عروض')},
 {id:'tables',label:'الطاولات والكراسي والشخصيات',icon:'🪑',match:p=>/(الطاولات|الكراسي|الشخصيات)/.test(p.category||'')},
 {id:'offers',label:'العروض والبكجات',icon:'🎁',match:p=>String(p.category||'').startsWith('عروض')},
 {id:'other',label:'بنود أخرى',icon:'✨',match:p=>/(بنود أخرى)/.test(p.category||'')}
];
let current='all', currentCat='', cart=JSON.parse(localStorage.getItem('alm_cart_clean')||'[]'), selectedOption=null;
function priceOf(p){return Number(p.priceOneDay||p.unitPrice||p.baseDecorPrice||p.baseTotal||p.priceTwoDays||0)}
function img(p){return p.image || 'order-ad.jpg'}
function groupProducts(){return PRODUCTS.filter(p=>GROUPS.find(g=>g.id===current).match(p))}
function init(){
 nav.innerHTML=GROUPS.map(g=>`<button onclick="setGroup('${g.id}')" class="${g.id===current?'active':''}">${g.icon} ${g.label}</button>`).join('');
 catrow.innerHTML=GROUPS.filter(g=>g.id!=='all').map(g=>`<button class="catcard" onclick="setGroup('${g.id}')"><span class="ico">${g.icon}</span><b>${g.label}</b><small>${PRODUCTS.filter(p=>g.match(p)).length}</small></button>`).join('');
 renderChips(); renderProducts(); updateCartUI();
}
function setGroup(id){current=id;currentCat='';init();window.scrollTo({top:0,behavior:'smooth'})}
function renderChips(){
 let cats=[...new Set(groupProducts().map(p=>p.category).filter(Boolean))];
 chips.innerHTML = [`<button class="chip ${!currentCat?'active':''}" onclick="currentCat='';renderChips();renderProducts()">الكل</button>`].concat(cats.map(c=>`<button class="chip ${c===currentCat?'active':''}" onclick="currentCat=${JSON.stringify(c)};renderChips();renderProducts()">${c}</button>`)).join('');
}
function renderProducts(){
 let term=(q.value||'').trim().toLowerCase();
 let list=groupProducts().filter(p=>!currentCat||p.category===currentCat).filter(p=>{
  let s=[p.number,p.name,p.category,p.type,p.details].join(' ').toLowerCase(); return !term || s.includes(term)
 });
 if(sort.value==='price') list.sort((a,b)=>priceOf(a)-priceOf(b)); else if(sort.value==='num') list.sort((a,b)=>(a.number||0)-(b.number||0));
 products.innerHTML=list.length?list.map(p=>`<article class="card">
  <span class="num">#${p.number||p.id}</span>
  <div class="pic"><img src="${img(p)}" loading="lazy" onerror="this.src='order-ad.jpg'"></div>
  <div class="info"><h3>${p.name||''}</h3><div class="meta"><span>${p.category||''}</span><span>${p.type||'حسب الطلب'}</span></div>
  <div class="price"><small>يبدأ من</small><b>${priceOf(p)} ر.ق</b></div>
  <div class="actions"><button class="details" onclick="openDetail(${p.id})">تفاصيل</button><button class="add" onclick="quickAdd(${p.id})">أضف</button></div></div>
 </article>`).join(''):`<div class="empty">لا توجد منتجات مطابقة.</div>`;
}
function optionsFor(p){
 let arr=[];
 if(p.priceOneDay) arr.push({label:p.durationOneDay||'يوم واحد',price:Number(p.priceOneDay)});
 if(p.priceTwoDays && p.priceTwoDays!=p.priceOneDay) arr.push({label:p.durationTwoDays||p.durationTwoDay||'يومين',price:Number(p.priceTwoDays)});
 if(p.decorPackages){Object.entries(p.decorPackages).forEach(([k,v])=>arr.push({label:`باقة ${k} طفل`,price:Number(p.baseDecorPrice||priceOf(p))+Number(v)}))}
 if(!arr.length) arr=[{label:'حسب الطلب',price:priceOf(p)}];
 return arr;
}
function openDetail(id){
 let p=PRODUCTS.find(x=>x.id===id); if(!p)return; selectedOption=optionsFor(p)[0];
 detailPanel.innerHTML=`<button class="close" onclick="closeSheets()">×</button>
 <img class="detail-img" src="${img(p)}" onerror="this.src='order-ad.jpg'">
 <h2>${p.name||''}</h2>
 <div class="box">${p.details||'تفاصيل المنتج حسب الطلب.'}</div>
 <div class="box"><label>اختيار السعر / الباقة</label><div class="options">${optionsFor(p).map((o,i)=>`<button class="opt ${i===0?'active':''}" onclick="chooseOpt(this,${p.id},${i})">${o.label}<br>${o.price} ر.ق</button>`).join('')}</div></div>
 <div class="box"><label>ملاحظات للطلب</label><textarea id="note" placeholder="مثلاً: اللون، اسم الطفل، المنطقة، أو أي ملاحظة"></textarea></div>
 <button class="primary" onclick="addSelected(${p.id})">أضف للسلة</button>
 <a class="secondary" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/97433317720?text=${encodeURIComponent('استفسار عن '+(p.name||''))}">استفسار واتساب</a>`;
 detailSheet.classList.add('show');
}
function chooseOpt(btn,id,i){[...detailPanel.querySelectorAll('.opt')].forEach(x=>x.classList.remove('active'));btn.classList.add('active');selectedOption=optionsFor(PRODUCTS.find(x=>x.id===id))[i]}
function quickAdd(id){let p=PRODUCTS.find(x=>x.id===id); let o=optionsFor(p)[0]; cart.push({id:p.id,name:p.name,img:img(p),price:o.price,option:o.label,note:''}); saveCart()}
function addSelected(id){let p=PRODUCTS.find(x=>x.id===id); let n=(document.getElementById('note')||{}).value||''; let o=selectedOption||optionsFor(p)[0]; cart.push({id:p.id,name:p.name,img:img(p),price:o.price,option:o.label,note:n}); saveCart(); closeSheets(); openCart()}
function saveCart(){localStorage.setItem('alm_cart_clean',JSON.stringify(cart));updateCartUI()}
function updateCartUI(){let c=cart.length,t=cart.reduce((s,x)=>s+Number(x.price||0),0);cartCount.textContent=barCount.textContent=c;barTotal.textContent=t}
function openCart(){
 let total=cart.reduce((s,x)=>s+Number(x.price||0),0);
 cartPanel.innerHTML=`<button class="close" onclick="closeSheets()">×</button><h2>سلة الحجز</h2>
 ${cart.length?cart.map((x,i)=>`<div class="cart-item"><img src="${x.img}" onerror="this.src='order-ad.jpg'"><div><b>${x.name}</b><small>${x.option} — ${x.price} ر.ق</small>${x.note?`<small>${x.note}</small>`:''}</div><button class="del" onclick="removeItem(${i})">حذف</button></div>`).join(''):'<div class="empty">السلة فارغة.</div>'}
 <div class="total"><span>الإجمالي</span><b>${total} ر.ق</b></div>
 <div class="box"><label>بيانات الحجز</label><input id="custName" placeholder="الاسم"><input id="custPhone" placeholder="رقم الجوال"><input id="custArea" placeholder="المنطقة"><input id="custDate" placeholder="تاريخ الحجز"><textarea id="custNote" placeholder="ملاحظات إضافية"></textarea></div>
 <button class="primary" onclick="sendCart()">إرسال الطلب واتساب</button><div class="footer-note">الحجز حسب توفر التاريخ. قد يطلب عربون حسب نوع الطلب.</div>`;
 cartSheet.classList.add('show');
}
function removeItem(i){cart.splice(i,1);saveCart();openCart()}
function sendCart(){
 let lines=['طلب حجز من كتالوج الملكة',''];
 cart.forEach((x,i)=>lines.push(`${i+1}) ${x.name} - ${x.option} - ${x.price} ر.ق${x.note?' - '+x.note:''}`));
 lines.push('',`الإجمالي: ${cart.reduce((s,x)=>s+Number(x.price||0),0)} ر.ق`,'','بيانات العميل:',
 `الاسم: ${custName.value||''}`,`الجوال: ${custPhone.value||''}`,`المنطقة: ${custArea.value||''}`,`التاريخ: ${custDate.value||''}`,`ملاحظات: ${custNote.value||''}`);
 location.href='https://wa.me/97433317720?text='+encodeURIComponent(lines.join('\n'));
}
function closeSheets(){detailSheet.classList.remove('show');cartSheet.classList.remove('show')}
detailSheet.onclick=e=>{if(e.target===detailSheet)closeSheets()}; cartSheet.onclick=e=>{if(e.target===cartSheet)closeSheets()};
init();
</script>
</body></html>
