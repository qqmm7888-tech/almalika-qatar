.priceChoice:has(input:checked)::after{opacity:1;animation:shineSweep 1.15s linear infinite}.priceChoice:has(input:checked) span,.priceChoice:has(input:checked) b{color:#8b0f2f}@keyframes selectedGlowPulse{0%{box-shadow:0 0 0 3px rgba(225,29,72,.14),0 12px 26px rgba(225,29,72,.20),0 0 18px rgba(255,214,10,.24)}100%{box-shadow:0 0 0 4px rgba(225,29,72,.22),0 22px 46px rgba(225,29,72,.30),0 0 38px rgba(255,214,10,.50)}}@keyframes selectedBgFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}@keyframes rotateGlow{0%{transform:rotate(0deg) scale(1)}100%{transform:rotate(360deg) scale(1)}}@keyframes haloPulse{0%{filter:blur(10px);opacity:.75}100%{filter:blur(14px);opacity:1}}@keyframes shineSweep{0%{left:-130%;opacity:0}15%{opacity:.95}100%{left:155%;opacity:0}}.bookingSimple{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.bookingSimple input,.bookingSimple select,.modalInfo textarea{border:1px solid #ffd4e7;background:#fff;border-radius:14px;padding:12px;font-weight:800;outline:0;min-height:44px}.modalInfo textarea{width:100%;min-height:70px;resize:vertical}.workNotice{background:#fff8dc;border:1px dashed #d4af37;border-radius:14px;padding:10px 12px;color:#6b4b00;font-weight:900;line-height:1.7;margin:10px 0}.modalInfo h3{margin:14px 0 8px;color:var(--maroon)}.detailIntro{background:linear-gradient(135deg,#fff8dc,#fff0f8);border:1px solid #ffe0ef;border-radius:16px;padding:11px;line-height:1.8;font-weight:800;color:#5b2438;margin:12px 0}.modalBox.detailed{grid-template-columns:320px 1fr}.cartDecorPicked{margin:10px 0 8px;font-size:17px;font-weight:900;color:#6A1B2E;background:#fff8e8;border:1px dashed rgba(212,175,55,.55);padding:10px 12px;border-radius:12px;line-height:1.8}

/* ===== V13 ULTRA VIP / FIXED RESPONSIVE MEASUREMENTS ===== */
:root{

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{

body:before{

.wrap{width:min(100% - 44px,1460px)!important;margin-inline:auto!important}

/* === V93 colorful glowing section/topic buttons === */
.nav button,.chip{
  position:relative;
  isolation:isolate;
  overflow:visible;
  border:1px solid rgba(255,255,255,.45);
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease, filter .25s ease;
}
.nav button::before,.chip::before{
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:inherit;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--glow) 55%, white 45%) 0%, rgba(255,255,255,0) 70%);
  filter:blur(12px);
  opacity:0;
  z-index:-2;
  transition:opacity .25s ease;
}
.nav button::after,.chip::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1.5px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--glow) 84%, white 16%), color-mix(in srgb, var(--glow2) 70%, white 30%));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.45;
  transition:opacity .25s ease;
}
.nav button:hover,.nav button.active,.chip:hover,.chip.active{
  color:#4b1026 !important;
  background:linear-gradient(180deg,#fff,#fff8fc) !important;
  border-color:color-mix(in srgb, var(--glow) 58%, white 42%);
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--glow) 45%, white 55%), 0 8px 18px color-mix(in srgb, var(--glow) 28%, transparent 72%), 0 0 22px color-mix(in srgb, var(--glow) 55%, transparent 45%);
  animation:glowBounce 2.1s ease-in-out infinite;
}
.nav button:hover::before,.nav button.active::before,.chip:hover::before,.chip.active::before{opacity:1;animation:haloPulse 1.8s ease-in-out infinite}
.nav button:hover::after,.nav button.active::after,.chip:hover::after,.chip.active::after{opacity:1}
.nav button:nth-child(6n+1), .chips .chip:nth-child(6n+1){--glow:#ff4d6d;--glow2:#ff9bb0}
.nav button:nth-child(6n+2), .chips .chip:nth-child(6n+2){--glow:#00c853;--glow2:#8dffb3}
.nav button:nth-child(6n+3), .chips .chip:nth-child(6n+3){--glow:#ffb300;--glow2:#ffe07d}
.nav button:nth-child(6n+4), .chips .chip:nth-child(6n+4){--glow:#00b8d4;--glow2:#80eaff}
.nav button:nth-child(6n+5), .chips .chip:nth-child(6n+5){--glow:#9c27b0;--glow2:#e39ef4}
.nav button:nth-child(6n), .chips .chip:nth-child(6n){--glow:#ff6f00;--glow2:#ffc56d}
@keyframes haloPulse{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes glowBounce{0%,100%{transform:translateY(-2px) scale(1.03)}50%{transform:translateY(-4px) scale(1.05)}}


/* === V94 soften action buttons under each product === */
.actions button{

.actions button::after{

<script id="almalika-v156-force-cart-x-red">
/* تلوين زر × داخل السلة حتى لو تم توليده بالجافاسكربت */
(function(){
  function paintCartX(){
    document.querySelectorAll('.cartItem button').forEach(function(btn){
      const txt = (btn.textContent || '').trim();
      const aria = (btn.getAttribute('aria-label') || '').trim();
      const title = (btn.getAttribute('title') || '').trim();
      const cls = btn.className || '';

      if(txt === '×' || txt === 'x' || txt === 'X' || aria.includes('حذف') || title.includes('حذف') || String(cls).includes('remove')){
        btn.style.setProperty('background', '#e60019', 'important');
        btn.style.setProperty('color', '#fff', 'important');
        btn.style.setProperty('border', '0', 'important');
        btn.style.setProperty('box-shadow', '0 5px 12px rgba(230,0,25,.25)', 'important');
      }
    });
  }

  paintCartX();
  document.addEventListener('DOMContentLoaded', paintCartX);
  document.addEventListener('click', function(){ setTimeout(paintCartX, 60); }, true);

function dateRangesOverlapCatalog(aStart,aEnd,bStart,bEnd){
  if(!aStart || !bStart)return false;
  aEnd=aEnd||aStart; bEnd=bEnd||bStart;
  return String(aStart)<=String(bEnd) && String(bStart)<=String(aEnd);
}
function getAdminOrders(){try{return JSON.parse(localStorage.getItem('almalikaAdminOrders')||'[]')}catch(e){return []}}
function tempHoldExpiredForCatalog(o){
  const st = String(o.status||'') + ' ' + String(o.paymentStatus||'');
  const confirmed = st.includes('مؤكد') || st.includes('تم دفع العربون') || st.includes('قيد التنفيذ');
  if(confirmed)return false;
  const t = new Date(o.createdAt||Date.now()).getTime();
  if(!t || isNaN(t))return false;
  return (Date.now()-t) > 24*60*60*1000;
}
function orderRangeTextCatalog(o){
  const s=o.eventDateArabic || arabicDateText(o.eventDate||'');
  const e=o.eventEndDate || '';
  if(!e || e===o.eventDate)return s;
  return `${s} إلى ${arabicDateText(e)}`;
}
function bookingInfoForCatalog(num,dateStr,endDateStr){
  if(!dateStr)return null;
  endDateStr=endDateStr||dateStr;
  const orders = getAdminOrders();
  const matches = orders.filter(o=>{
    if(!o || !dateRangesOverlapCatalog(dateStr,endDateStr,o.eventDate,o.eventEndDate||o.eventDate))return false;
    const st = String(o.status||'');
    if(st.includes('ملغي') || st.includes('مؤرشف') || st.includes('منتهي') || st.includes('فك الحجز'))return false;
    if(tempHoldExpiredForCatalog(o))return false;
    return (o.items||[]).some(i=>Number(i.number)===Number(num));
  });
  if(!matches.length)return null;
  const confirmed = matches.find(o=>{
    const st = String(o.status||'') + ' ' + String(o.paymentStatus||'');
    return st.includes('مؤكد') || st.includes('تم دفع العربون') || st.includes('تم تأكيد الحجز') || st.includes('قيد التنفيذ');
  });
  const picked = confirmed || matches[0];
  return {
    status: confirmed ? 'محجوزة' : 'محجوزة مؤقتًا',
    note: confirmed ? `هذا المنتج محجوز خلال الفترة: ${orderRangeTextCatalog(picked)}` : `هذا المنتج محجوز مؤقتًا خلال الفترة: ${orderRangeTextCatalog(picked)}`,
    orderId: picked.orderId || ''
  };
}
function bookingAlertForCatalog(num){
  const b = bookingInfoForCatalog(num, getCatalogEventDate(), getCatalogEventEndDate());
  if(!b)return '';
  return `${b.status}\n${b.note}${b.orderId?'\nرقم الطلب: '+b.orderId:''}`;
}

const themeThumbCache={};
async function getWikiThumb(page){
  if(!page)return '';
  if(themeThumbCache[page])return themeThumbCache[page];
  try{
    const url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(page);
    const r=await fetch(url,{cache:'force-cache'});
    if(!r.ok)throw new Error('no image');
    const d=await r.json();
    const img=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||'';
    themeThumbCache[page]=img;
    return img;
  }catch(e){return '';}
}
async function updateThemePreview(n){
  const sel=document.getElementById('themeSelect_'+n), img=document.getElementById('themePreview_'+n);
  if(!sel||!img)return;
  const opt=sel.selectedOptions[0];
  const fallback=opt?.dataset?.img||'101.jpg';
  img.style.display='block';
  img.src=fallback;
  const page=opt?.dataset?.page||'';
  const realImg=await getWikiThumb(page);
  if(realImg && sel.selectedOptions[0]===opt){img.src=realImg;}
}

function updateDecorTotal(n){
  const totalEl=document.getElementById('decorTotalAmount_'+n);
  const detailsEl=document.getElementById('decorTotalDetails_'+n);
  if(!totalEl)return;
  const base=selectedDecorBasePrice(n);
  const tableAdd=typeof selectedAddonCard==='function'?selectedAddonCard(n,'tableAddon'):{price:0,label:'بدون'};
  const stickerAdd=typeof selectedAddonCard==='function'?selectedAddonCard(n,'stickerAddon'):{price:0,label:'بدون'};
  const total=base+Number(tableAdd.price||0)+Number(stickerAdd.price||0);
  totalEl.textContent=total.toLocaleString('en-US')+' ر.ق';
  if(detailsEl){
    const parts=[`الباقة: ${base.toLocaleString('en-US')} ر.ق`];
    if(tableAdd.price>0)parts.push(`الطاولات: ${tableAdd.price} ر.ق`);
    if(stickerAdd.price>0)parts.push(`الملصقات: ${stickerAdd.price} ر.ق`);
    detailsEl.textContent=parts.join(' + ');
  }
}

function todayISO(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isPastDate(value){
  return value && value < todayISO();
}
function applyDateRestrictions(root=document){
  const today=todayISO();
  root.querySelectorAll('input[type="date"]').forEach(inp=>{
    inp.min=today;
    if(inp.value && inp.value < today){
      inp.value=today;
    }
    if(!inp.dataset.noPastBound){
      inp.dataset.noPastBound='1';
      inp.addEventListener('change',()=>{
        if(inp.value && inp.value < todayISO()){
          alert('لا يمكن اختيار تاريخ سابق أو منتهي. يرجى اختيار تاريخ اليوم أو تاريخ قادم.');
          inp.value=todayISO();
        }
      });
    }
  });
}

function addToCart(n){

  let b=null;

    b=(typeof collectBooking==='function')?collectBooking(p):null;
  }catch(e){
    console.error('collectBooking error', e);
    alert('صار خطأ أثناء قراءة بيانات الحجز. أغلق التفاصيل وافتح المنتج مرة ثانية.');
    return;

  const chosenDecorImage=(b && b.selectedDecorImage)?b.selectedDecorImage:'';

  const item={

    qty:1,
    cartKey:`${n}_${Date.now()}`,
    originalImage:((typeof productImageUrl==='function'?productImageUrl(p):p.image)||p.image||`${p.number}.jpg`),
    image:(b && b.selectedDecorImage ? b.selectedDecorImage : ((typeof productImageUrl==='function'?productImageUrl(p):p.image) || p.image || `${p.number}.jpg`)),
    selectedDecorImage:chosenDecorImage,

function orderNeedsDeposit(items){
  items = items || cart || [];

    try { return sectionOf(x) !== 'bouncies'; } catch(e) {
      const c=String(x.category||''), t=String(x.type||''), n=String(x.name||'');

}
function depositRequiredFor(items,total){

function normalizeSectionToken(x){

  if(['snacks','snack'].includes(x) || x.includes('سناك') || x.includes('عربات') || x.includes('العربات')) return 'snacks';
  if(['events','event'].includes(x) || x.includes('تجهيز') || x.includes('حفلات') || x.includes('المناسبات')) return 'events';
  if(['rentals','rental'].includes(x) || x.includes('طاول') || x.includes('كراسي') || x.includes('كرسي') || x.includes('شخصيات') || x.includes('كرتونية')) return 'rentals';

  return '';
}

/* === V123 correct date rules without slowing the site === */
(function(){
  function todayISO(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  window.isPastDate=function(v){
    return !!v && v < todayISO();
  };

  function updateRangeEndMin(){
    const start=document.getElementById('catalogEventDate');
    const end=document.getElementById('catalogEventEndDate');
    if(!end)return;
    const min=(start && start.value) ? start.value : todayISO();
    end.min=min;
    end.setAttribute('min',min);
    if(end.value && end.value < min){
      alert('تاريخ نهاية الحجز يجب أن يكون نفس تاريخ البداية أو بعده.');
      end.value='';
    }
  }

  window.applyDateLight=function(root=document){
    const today=todayISO();
    (root||document).querySelectorAll('input[type="date"]').forEach(inp=>{
      // حقول فترة الحجز في أعلى الصفحة
      if(inp.id==='catalogEventDate'){
        inp.min=today;
        inp.setAttribute('min',today);
        if(inp.value && inp.value < today) inp.value='';
        if(!inp.dataset.v123Bound){
          inp.dataset.v123Bound='1';
          inp.addEventListener('change',()=>{
            if(inp.value && inp.value < todayISO()){
              alert('لا يمكن اختيار تاريخ بداية سابق. اختر تاريخ اليوم أو تاريخ قادم.');
              inp.value='';
            }
            updateRangeEndMin();
            if(typeof render==='function') render();
          });
        }
        return;
      }

      if(inp.id==='catalogEventEndDate'){
        updateRangeEndMin();
        if(!inp.dataset.v123Bound){
          inp.dataset.v123Bound='1';
          inp.addEventListener('change',()=>{
            updateRangeEndMin();
            if(typeof render==='function') render();
          });
        }
        return;
      }

      // حقول التاريخ داخل تفاصيل المنتج / الطلب
      inp.min=today;
      inp.setAttribute('min',today);

      // هنا نعبّي تاريخ الحجز بتلقائي اليوم، حتى لا يفتح التقويم على تواريخ سابقة
      if(!inp.value || inp.value < today){
        inp.value=today;
      }

      if(!inp.dataset.v123Bound){
        inp.dataset.v123Bound='1';
        inp.addEventListener('focus',()=>{
          inp.min=todayISO();
          inp.setAttribute('min',todayISO());
          if(!inp.value || inp.value < todayISO()) inp.value=todayISO();
        });
        inp.addEventListener('change',()=>{
          if(inp.value && inp.value < todayISO()){
            alert('لا يمكن اختيار تاريخ سابق. اختر تاريخ اليوم أو تاريخ قادم.');
            inp.value=todayISO();
          }
        });
      }
    });
  };

  document.addEventListener('DOMContentLoaded',()=>{
    window.applyDateLight(document);
    updateRangeEndMin();
  });
  window.addEventListener('load',()=>{
    window.applyDateLight(document);
    updateRangeEndMin();
  });
})();



/* === V130 clean buttons and dates === */
(function(){
  function todayISO(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  window.todayISO=todayISO;
  window.isPastDate=function(v){return !!v && v < todayISO();};

  window.applyDatesV130=function(root=document){
    const today=todayISO();
    (root||document).querySelectorAll('input[type="date"]').forEach(inp=>{
      inp.min=today;
      inp.setAttribute('min',today);
      if(inp.id && inp.id.startsWith('date_')){
        if(!inp.value || inp.value < today) inp.value=today;
      }else if(inp.value && inp.value < today){
        inp.value='';
      }
      if(!inp.dataset.v130Date){
        inp.dataset.v130Date='1';
        const fix=()=>{
          const now=todayISO();
          inp.min=now;
          inp.setAttribute('min',now);
          if(inp.id && inp.id.startsWith('date_')){
            if(!inp.value || inp.value < now) inp.value=now;
          }else if(inp.value && inp.value < now){

            inp.value='';
          }
        };
        inp.addEventListener('focus',fix);
        inp.addEventListener('click',fix);
        inp.addEventListener('change',fix);
      }
    });
  };

  document.addEventListener('click',function(e){
    const btn=e.target.closest('button');
    if(!btn)return;
    const txt=(btn.textContent||'').trim();

    function numberFromModalOrButton(){
      const on=btn.getAttribute('onclick')||'';
      let m=on.match(/\((\d+)\)/);

      const modal=document.querySelector('.modal.show,.modal');
      if(modal){

        if(m)return Number(m[1]);

      const card=btn.closest('.product');

      return null;

})();

<script id="almalika-v154-lock-past-dates">
/* ===== V154: إقفال التواريخ المنتهية في كل مكان ===== */
(function(){
  function todayISO(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }

  function lockDateInput(input){
    if(!input || input.type !== 'date') return;
    const min = todayISO();
    input.setAttribute('min', min);

    if(input.value && input.value < min){
      input.value = min;
      input.dispatchEvent(new Event('change', {bubbles:true}));
    }

    if(input.dataset.v154Locked) return;
    input.dataset.v154Locked = '1';

    input.addEventListener('input', function(){
      const m = todayISO();
      this.setAttribute('min', m);
      if(this.value && this.value < m){
        alert('لا يمكن اختيار تاريخ سابق. الرجاء اختيار تاريخ اليوم أو تاريخ قادم.');
        this.value = m;
        this.dispatchEvent(new Event('change', {bubbles:true}));
      }
    });

    input.addEventListener('change', function(){
      const m = todayISO();
      this.setAttribute('min', m);
      if(this.value && this.value < m){
        alert('لا يمكن اختيار تاريخ سابق. الرجاء اختيار تاريخ اليوم أو تاريخ قادم.');
        this.value = m;
        this.dispatchEvent(new Event('change', {bubbles:true}));
      }
    });
  }

  function lockAllDates(){
    document.querySelectorAll('input[type="date"]').forEach(lockDateInput);

    // ضمان إضافي: أي تاريخ نهاية لا يكون قبل تاريخ البداية داخل نفس المجموعة/النموذج
    const starts = document.querySelectorAll(
      'input[type="date"][name*="start"], input[type="date"][id*="start"], input[type="date"][placeholder*="بداية"], input[type="date"][aria-label*="بداية"]'
    );

    starts.forEach(function(start){
      const box = start.closest('form,.cartForm,.bookingSimple,.modalInfo,.modalBox,.cartModal,section,div') || document;
      const dates = Array.from(box.querySelectorAll('input[type="date"]'));
      if(dates.length < 2) return;

      const end = dates.find(function(x){ return x !== start; });
      if(!end) return;

      if(start.value){
        end.min = start.value > todayISO() ? start.value : todayISO();
        if(end.value && end.value < end.min){
          end.value = end.min;
          end.dispatchEvent(new Event('change', {bubbles:true}));
        }
      }

      if(start.dataset.v154EndLinked) return;
      start.dataset.v154EndLinked = '1';
      start.addEventListener('change', function(){
        const m = todayISO();
        end.min = this.value && this.value > m ? this.value : m;
        if(end.value && end.value < end.min){
          end.value = end.min;
          end.dispatchEvent(new Event('change', {bubbles:true}));
        }
      });
    });
  }

  lockAllDates();
  document.addEventListener('DOMContentLoaded', lockAllDates);
  document.addEventListener('click', function(){ setTimeout(lockAllDates, 80); }, true);
  document.addEventListener('focusin', function(e){
    if(e.target && e.target.matches && e.target.matches('input[type="date"]')){
      lockDateInput(e.target);
    }
  }, true);

  const observer = new MutationObserver(function(){ lockAllDates(); });
  observer.observe(document.documentElement, {childList:true, subtree:true});

  window.almalikaLockPastDates = lockAllDates;
})();
</script>

<script id="almalika-v179-required-fields-highlight-js">
/* تمييز المطلوب من الزبون تلقائياً */
(function(){
  function addBadge(title){
    if(!title || title.querySelector('.requiredBadge')) return;
    const badge = document.createElement('span');
    badge.className = 'requiredBadge';
    badge.textContent = 'مطلوب';
    title.appendChild(badge);
    title.classList.add('requiredChoiceTitle');
  }

  function markRequiredFields(){
    const requiredIdParts = [
      'date_', 'period_', 'custName', 'custPhone', 'custDate',
      'child_', 'themeSelect_', 'decorImage_'
    ];

    document.querySelectorAll('input, select, textarea').forEach(function(el){
      const id = el.id || '';
      const ph = el.getAttribute('placeholder') || '';
      const firstOpt = el.tagName === 'SELECT' && el.options && el.options[0] ? (el.options[0].textContent || '') : '';

      const isRequired =
        el.required ||
        ph.includes('*') ||
        requiredIdParts.some(function(part){ return id.includes(part); }) ||
        firstOpt.includes('اختار وقت') ||
        firstOpt.includes('نوع المناسبة') ||
        firstOpt.includes('مكان التنفيذ') ||
        firstOpt.includes('مكان التقديم') ||
        firstOpt.includes('مكان الاستخدام') ||
        firstOpt.includes('مكان التركيب');

      if(isRequired){
        el.classList.add('requiredCustomerField');
        if(ph && !ph.includes('*') && (id.includes('date_') || id.includes('period_') || id.includes('child_'))){
          el.setAttribute('placeholder', ph + ' *');
        }
      }
    });

    // اختيار الباقة مطلوب
    document.querySelectorAll('.priceChoiceGrid').forEach(function(box){
      box.classList.add('requiredChoiceBox');
      const h = box.previousElementSibling;
      if(h && h.tagName && /^H[1-6]$/.test(h.tagName)) addBadge(h);
    });

    // الشخصية/الثيم مطلوبة في الديكور
    document.querySelectorAll('.themeChoiceBox').forEach(function(box){
      box.classList.add('requiredChoiceBox');
      const title = box.querySelector('.choiceBoxTitle');
      addBadge(title);
    });

    // ألوان البالونات: اختيار مهم وواضح
    document.querySelectorAll('.balloonColorBox').forEach(function(box){
      box.classList.add('requiredChoiceBox');
      const title = box.querySelector('.choiceBoxTitle');
      if(title && !title.querySelector('.optionalText')){
        addBadge(title);
      }
    });

    // الألوان اللامعة للديكور 102 و103
    document.querySelectorAll('.shinyBalloonBox').forEach(function(box){
      box.classList.add('requiredChoiceBox');
      const title = box.querySelector('.shinyBalloonTitle');
      addBadge(title);
    });

    // السناك المقدم للأطفال اختياره واضح
    document.querySelectorAll('.snackChoiceBox').forEach(function(box){
      box.classList.add('requiredChoiceBox');
      const title = box.querySelector('.choiceBoxTitle');
      addBadge(title);
    });

    // تلوين النصوص التي فيها نجمة
    document.querySelectorAll('input[placeholder*="*"], textarea[placeholder*="*"]').forEach(function(el){
      el.classList.add('requiredCustomerField');
    });
  }

  markRequiredFields();
  document.addEventListener('DOMContentLoaded', markRequiredFields);
  document.addEventListener('click', function(){ setTimeout(markRequiredFields, 80); }, true);
  document.addEventListener('input', function(){ setTimeout(markRequiredFields, 20); }, true);
  new MutationObserver(markRequiredFields).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>

<script id="almalika-v189-disable-snacks-when-decor-only-js">
/* قفل السناك عند اختيار باقة "ديكور فقط" */
(function(){
  function getDecorOnlySelected(n){
    const checked = document.querySelector(`input[name="opt_${n}"]:checked, input[name="price_${n}"]:checked`);
    if(!checked) return false;
    const label = checked.closest('label');
    const txt = (label ? label.textContent : checked.value || '').replace(/\s+/g,' ').trim();
    return /ديكور\s*فقط/.test(txt);
  }

  function clearSnackChoices(n){
    document.querySelectorAll(`input[name="snack_${n}"], input[name="snacks_${n}"], input[id^="snack_${n}_"], input[id^="snacks_${n}_"]`).forEach(function(inp){
      inp.checked = false;
      inp.disabled = true;
    });

    const box = document.querySelector(`#snackBox_${n}, .snackChoiceBox[data-product="${n}"]`) || document.querySelector(`input[name="snack_${n}"], input[name="snacks_${n}"]`)?.closest('.snackChoiceBox');
    if(box) box.classList.add('decorOnlyLocked');
  }

  function unlockSnackChoices(n){
    document.querySelectorAll(`input[name="snack_${n}"], input[name="snacks_${n}"], input[id^="snack_${n}_"], input[id^="snacks_${n}_"]`).forEach(function(inp){
      inp.disabled = false;
    });

    const box = document.querySelector(`#snackBox_${n}, .snackChoiceBox[data-product="${n}"]`) || document.querySelector(`input[name="snack_${n}"], input[name="snacks_${n}"]`)?.closest('.snackChoiceBox');
    if(box) box.classList.remove('decorOnlyLocked');
  }

  window.applyDecorOnlySnackLock = function(n){
    if(!n) return;
    if(getDecorOnlySelected(n)){
      clearSnackChoices(n);
    }else{
      unlockSnackChoices(n);
    }
  };

  function applyAll(){
    document.querySelectorAll('[id^="decorTotal_"], [id^="child_"], [id^="themeSelect_"], input[name^="opt_"], input[name^="price_"]').forEach(function(el){
      const id = el.id || el.name || '';
      const m = id.match(/_(\d+)/);
      if(m) applyDecorOnlySnackLock(m[1]);
    });
  }

  document.addEventListener('change', function(e){
    const el = e.target;
    if(!el) return;
    const id = el.id || el.name || '';
    const m = id.match(/_(\d+)/);
    if(m){
      setTimeout(function(){ applyDecorOnlySnackLock(m[1]); }, 30);
    }
  }, true);

  document.addEventListener('click', function(){
    setTimeout(applyAll, 80);
  }, true);

  document.addEventListener('DOMContentLoaded', applyAll);
  new MutationObserver(applyAll).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script id="almalika-v205-last-chosen-decor-shape">
/* V205: حفظ آخر شكل ديكور اختاره/لمسه الزبون فعلياً */
(function(){
  window.__selectedDecorChoices = window.__selectedDecorChoices || {};

  function productNumberFromThumb(btn){
    const modalPic = btn && btn.closest ? btn.closest('.modalPic') : null;
    const main = modalPic ? modalPic.querySelector('[id^="mainImg_"]') : document.querySelector('#modal [id^="mainImg_"]');
    if(main && main.id){
      const m = main.id.match(/mainImg_(\d+)/);
      if(m) return m[1];
    }

    const hidden = btn && btn.closest ? btn.closest('.decorGallery')?.querySelector('[id^="decorImage_"]') : null;
    if(hidden && hidden.id){
      const m = hidden.id.match(/decorImage_(\d+)/);
      if(m) return m[1];
    }
    return '';
  }

  function thumbChoice(btn){
    if(!btn) return null;
    const imgEl = btn.querySelector ? btn.querySelector('img') : null;
    const img = (btn.dataset && btn.dataset.decorImg) || (imgEl && (imgEl.getAttribute('src') || imgEl.currentSrc || imgEl.src)) || '';
    const label = (btn.dataset && btn.dataset.decorLabel) || (btn.querySelector('small') ? btn.querySelector('small').textContent.trim() : 'الصورة المختارة') || 'الصورة المختارة';
    const n = productNumberFromThumb(btn);
    if(!n || !img) return null;
    return {n:String(n), img:String(img), label:String(label)};
  }

  function storeThumb(btn){
    const c = thumbChoice(btn);
    if(!c) return;

    window.__selectedDecorChoices[c.n] = {img:c.img, label:c.label};

    const main = document.getElementById('mainImg_' + c.n);
    const hidden = document.getElementById('decorImage_' + c.n);

    if(main) main.src = c.img;
    if(hidden) hidden.value = c.img;

    let labelInput = document.getElementById('decorImageLabel_' + c.n);
    if(!labelInput){
      labelInput = document.createElement('input');
      labelInput.type = 'hidden';
      labelInput.id = 'decorImageLabel_' + c.n;
      if(hidden && hidden.parentNode) hidden.parentNode.appendChild(labelInput);
    }
    if(labelInput) labelInput.value = c.label;

    document.querySelectorAll('#modal .decorThumb').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
  }

  ['click','pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      const btn = e.target && e.target.closest ? e.target.closest('.decorThumb') : null;
      if(btn) storeThumb(btn);
    }, true);
  });

  const oldSelect = window.selectDecorImage;
  window.selectDecorImage = function(n,img,btn){
    if(btn) storeThumb(btn);
    else if(typeof oldSelect === 'function') oldSelect.apply(this, arguments);
  };
})();
</script>

<script id="almalika-v211-real-cart-selected-decor">
/* V211: إصلاح حقيقي — تعديل cart نفسها وليس window.cart */
(function(){
  let lastDecorChoice = {};

  function getProductNoFromModal(){
    const main = document.querySelector('#modal [id^="mainImg_"]');
    if(main && main.id){
      const m = main.id.match(/mainImg_(\d+)/);
      if(m) return m[1];
    }
    return '';
  }

  function readThumb(btn){
    if(!btn) return null;
    const n = getProductNoFromModal();
    const imgEl = btn.querySelector('img');
    const img = (btn.dataset && btn.dataset.decorImg) ||
                (imgEl && (imgEl.getAttribute('src') || imgEl.currentSrc || imgEl.src)) ||
                '';
    const label = (btn.dataset && btn.dataset.decorLabel) ||
                  (btn.querySelector('small') ? btn.querySelector('small').textContent.trim() : '') ||
                  'الصورة المختارة';

    if(!n || !img) return null;
    return {n:String(n), img:String(img), label:String(label)};
  }

  function saveChoice(choice){
    if(!choice || !choice.n || !choice.img) return;
    lastDecorChoice[choice.n] = {img:choice.img, label:choice.label};

    const main = document.getElementById('mainImg_' + choice.n);
    const hidden = document.getElementById('decorImage_' + choice.n);

    if(main) main.src = choice.img;
    if(hidden) hidden.value = choice.img;

    document.querySelectorAll('#modal .decorThumb').forEach(x => x.classList.remove('active'));
    const btn = [...document.querySelectorAll('#modal .decorThumb')].find(b => {
      const imgEl = b.querySelector('img');
      const src = (b.dataset && b.dataset.decorImg) || (imgEl && (imgEl.getAttribute('src') || imgEl.src)) || '';
      return src === choice.img;
    });
    if(btn) btn.classList.add('active');
  }

  function patchRealCart(n, choice){
    if(!choice || !choice.img) return false;
    let changed = false;

    try{
      if(Array.isArray(cart)){
        cart.forEach(function(it){
          if(it && Number(it.number) === Number(n)){
            it.image = choice.img;
            it.selectedDecorImage = choice.img;
            it.selectedDecorLabel = choice.label || 'الصورة المختارة';
            it.bookingSummary = (it.bookingSummary || []).filter(function(line){
              return !String(line || '').includes('شكل الديكور');
            });
            it.bookingSummary.push('🖼️ شكل الديكور المختار: ' + it.selectedDecorLabel);
            changed = true;
          }
        });

        if(changed){
          try{ localStorage.setItem('almalikaCart', JSON.stringify(cart)); }catch(e){}
          try{ if(typeof saveCart === 'function') saveCart(); }catch(e){}
          try{ if(typeof updateCartBadge === 'function') updateCartBadge(); }catch(e){}
        }
      }
    }catch(e){}

    return changed;
  }

  ['click','pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      const btn = e.target && e.target.closest ? e.target.closest('.decorThumb') : null;
      if(!btn) return;
      const c = readThumb(btn);
      if(c) saveChoice(c);
    }, true);
  });

  const oldAdd = window.addToCart;
  window.addToCart = function(n){
    const nStr = String(n);
    const active = document.querySelector('#modal .decorThumb.active');
    const activeChoice = active ? readThumb(active) : null;
    const choice = activeChoice || lastDecorChoice[nStr] || null;

    if(choice) saveChoice(choice);

    const result = typeof oldAdd === 'function' ? oldAdd.apply(this, arguments) : undefined;

    if(choice){
      patchRealCart(nStr, choice);
      setTimeout(function(){ patchRealCart(nStr, choice); }, 80);
      setTimeout(function(){
        patchRealCart(nStr, choice);
        try{ if(typeof openCart === 'function') openCart(); }catch(e){}
      }, 220);
    }

    return result;
  };

  const oldOpen = window.openCart;
  window.openCart = function(){
    try{
      if(Array.isArray(cart)){
        cart.forEach(function(it){
          if(it && it.selectedDecorImage){
            it.image = it.selectedDecorImage;
          }
        });
        localStorage.setItem('almalikaCart', JSON.stringify(cart));
      }
    }catch(e){}

    return typeof oldOpen === 'function' ? oldOpen.apply(this, arguments) : undefined;
  };
})();
</script>

  function normalizePackage(pack){
    if(!pack) return pack;
    if(pack.kids == null && pack.children != null) pack.kids = pack.children;
    if(pack.children == null && pack.kids != null) pack.children = pack.kids;
    if(!pack.note) pack.note = 'مدة الخدمة 3 ساعات مع موظفة';
    return pack;
  }

  function syncSnackProduct(p){
    if(!p) return p;
    const arr = snackPriceMap[String(p.number)] || snackPriceMap[String(p.id)];
    if(arr && arr.length){
      p.snackPackages = arr.map(x => normalizePackage(Object.assign({}, x)));
      p.priceOneDay = Number(arr[0].price);
      p.priceTwoDays = Number(arr[0].price);
      p.baseTotal = Number(arr[0].price);

      p.snackPackages.forEach(normalizePackage);
    }
    return p;

  }catch(e){}

  const oldPriceHtml = window.priceHtml;
  window.priceHtml = function(p){

  function escV229(s){
    try{ return (typeof esc === 'function') ? esc(s) : String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

            p.gallery = g.slice();
          }

      });
      window.__almalikaInternalGalleries = Object.assign({}, window.__almalikaInternalGalleries || {}, galleries);

  const oldDecorGalleryFilesV229 = window.decorGalleryFiles;
  window.decorGalleryFiles = decorGalleryFiles = function(p){

    if(typeof oldDecorGalleryFilesV229 === 'function') return oldDecorGalleryFilesV229.apply(this, arguments);

    const imgErr = "if(!this.dataset.retry){this.dataset.retry='1';if(this.src.endsWith('.jpg')){this.src=this.src.replace('.jpg','.jpg')}else if(this.src.endsWith('.jpg')){this.src=this.src.replace('.jpg','.jpg')}}else{var b=this.closest('.decorThumb');if(b)b.style.display='none'}";

<script id="almalika-v266-image-fix-js">
(function(){
  function digits(v){return String(v||'').replace(/[^0-9]/g,'')}
  function safeAbs(src){try{return new URL(src, location.origin + '/').href}catch(e){return src}}
  function candidates(n, src){
    n=digits(n);
    const list=[];
    function add(x){if(x && !list.includes(x)) list.push(x)}
    if(src && !/^data:/i.test(src)) add(src);
    if(src && /^data:/i.test(src)) add(src);
    if(n){
      ['', './', 'images/', './images/', '/images/', 'img/', './img/', '/img/', 'assets/', './assets/', '/assets/'].forEach(function(prefix){
        ['.jpg','.jpg','.png','.webp','.JPG','.jpg','.PNG','.WEBP'].forEach(function(ext){add(prefix+n+ext)})
      });
    }
    return list;
  }
  window.productImageUrl=function(p){
    if(!p) return '';
    const src=(p.image||'').trim();
    if(/^data:/i.test(src)) return src;
    const n=digits(p.number||p.id||p.bounceNo);
    return safeAbs(src || (n ? n+'.jpg' : ''));
  };
  window.tryProductImageFallback=function(img,n){
    try{
      n=digits(n || img.dataset.productNumber || img.closest('.product')?.querySelector('.num')?.textContent || img.id || '');
      let list=img._amCandidates || candidates(n, img.getAttribute('src')||'');
      let i=Number(img._amIndex||0)+1;
      img._amCandidates=list; img._amIndex=i;
      if(i<list.length){
        img.onerror=function(){window.tryProductImageFallback(img,n)};
        img.src=list[i];
      }else{
        img.onerror=null;
        const box=img.closest('.pic,.modalPic,.quickShopPic');
        if(box) box.classList.add('imgMissing');
      }
    }catch(e){try{img.onerror=null}catch(_e){}}
  };
  function numberFromCard(card){
    let no=digits(card.querySelector('.num')?.textContent || '');
    if(no) return no;
    const el=card.querySelector('[onclick*="openProduct("],[onclick*="quickShop("]');
    const m=el && (el.getAttribute('onclick')||'').match(/\((\d+)\)/);
    return m?m[1]:'';
  }
  function prepare(root){
    try{
      (root||document).querySelectorAll('.product').forEach(function(card){
        const n=numberFromCard(card);
        const p=(Array.isArray(products)?products:[]).find(x=>Number(x.number)===Number(n));
        const img=card.querySelector('.pic img');
        if(!img || !n || !p) return;
        img.dataset.productNumber=n;
        const src=productImageUrl(p);
        img._amCandidates=candidates(n,src);
        img._amIndex=0;
        img.onerror=function(){window.tryProductImageFallback(img,n)};
        if(!img.getAttribute('src') || img.getAttribute('src')!==src) img.src=src;
      });
    }catch(e){}
  }
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){const out=oldRender.apply(this,arguments);setTimeout(()=>prepare(document),40);setTimeout(()=>prepare(document),180);return out}
  }
  const oldOpenProduct=window.openProduct;
  if(typeof oldOpenProduct==='function'){
    window.openProduct=function(){const out=oldOpenProduct.apply(this,arguments);setTimeout(()=>prepare(document),40);return out}
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>prepare(document),120));
  window.addEventListener('load',()=>setTimeout(()=>prepare(document),220));
  window.addEventListener('hashchange',()=>setTimeout(()=>prepare(document),120));
})();
</script>

<script id="almalika-v272-remove-empty-images-js">
(function(){
  function markMissing(img){
    try{
      var btn = img.closest('.decorThumb');
      if(btn) btn.remove();
      cleanEmptyGalleries();
    }catch(e){}
  }

  function cleanEmptyGalleries(){
    try{
      document.querySelectorAll('.decorGallery').forEach(function(g){
        var thumbs = g.querySelectorAll('.decorThumb');
        if(!thumbs.length) g.classList.add('noImages');
      });
    }catch(e){}

      const obj = {};
      packs.forEach(function(x){
        if(!x) return;
        const kids = Number(x.kids || x.children || x.count || 0);
        const price = Number(x.price || x.amount || 0);
        if(kids && price) obj[String(kids)] = price;
      });
      return obj;
    }
    return packs;
  }

  const oldOptList = window.optList;
  window.optList = optList = function(p){

        const packs = normalizeDecorPackages(p);
        const opts = [{id:'decor-only', label:'ديكور فقط', price:base, note:`السعر الأساسي ${base} ر.ق`}];

          .map(x => Number(x))

      p.name, p.title, p.status, p.badge, p.note, p.notes,
      p.availability, p.availableText, p.unavailableText,
      p.details, p.description, p.type, p.category
    ].map(function(v){return v == null ? '' : String(v);}).join(' ');
    return p.available === false || p.disabled === true || p.outOfStock === true ||
           p.isUnavailable === true || p.unavailable === true ||
           /غير\s*متاح|خارج\s*عن\s*الخدمة|عطلان|متوقف|غير\s*متوفر/.test(blob);
  }

  // المختارات العامة: خذ أول بندين متاحين فقط من كل قسم، ولا تحسب غير المتاح أصلاً.
  window.vipGeneralProducts = vipGeneralProducts = function(){
    var order = ['bouncies','snacks','events','rentals','other'];
    var out = [];
    order.forEach(function(sec){
      var picked = 0;
      products
        .filter(function(p){ return sectionOf(p) === sec; })
        .sort(function(a,b){ return Number(a.number||0) - Number(b.number||0); })
        .some(function(p){
          if(vipBlockedProduct(p)) return false;
          if(!out.some(function(x){ return Number(x.number) === Number(p.number); })){
            out.push(p);
            picked++;
          }
          return picked >= 2;
        });
    });
    return out.slice(0,10);
  };

  // مختارات العروض: أي عرض غير متاح لا يظهر في مختارات العروض.
  window.vipOfferProducts = vipOfferProducts = function(){
    var seen = new Set();
    return products
      .filter(function(p){ return sectionOf(p) === 'offers'; })
      .filter(function(p){ return !vipBlockedProduct(p); })
      .sort(function(a,b){ return Number(a.number||0) - Number(b.number||0); })
      .filter(function(p){
        var k = Number(p.number);
        if(seen.has(k)) return false;
        seen.add(k);
        return true;
      });
  };

  // تنظيف احتياطي بعد الرسم: يستهدف كروت الموقع الحقيقية .product داخل سكاشن المختارات فقط.
  function cleanVipUnavailableCards(){
    try{
      document.querySelectorAll('section').forEach(function(section){
        var title = section.querySelector('h1,h2,h3');
        var t = title ? title.textContent : section.textContent.slice(0,250);
        if(!/مختارات\s*VIP\s*عامة|مختارات\s*خاصة\s*للعروض|VIP/.test(t)) return;
        section.querySelectorAll('.product,.card,.product-card,.productCard,[data-product],[data-id]').forEach(function(card){
          var txt = card.textContent || '';
          var nTxt = (card.querySelector('.num') || {}).textContent || '';
          var n = Number(String(nTxt).replace(/[^0-9]/g,''));
          if(/غير\s*متاح|خارج\s*عن\s*الخدمة|عطلان|متوقف|غير\s*متوفر/.test(txt) || (n && typeof forcedUnavailableCatalog==='function' && forcedUnavailableCatalog(n))){
            card.remove();
          }
        });
      });
    }catch(e){}
  }

  var oldRender = window.render;
  if(typeof oldRender === 'function' && !oldRender.__vipClean292){
    window.render = render = function(){
      var out = oldRender.apply(this, arguments);
      setTimeout(cleanVipUnavailableCards, 20);
      setTimeout(cleanVipUnavailableCards, 120);
      setTimeout(cleanVipUnavailableCards, 350);
      return out;
    };
    window.render.__vipClean292 = true;
  }

  document.addEventListener('DOMContentLoaded', function(){
    if(typeof render === 'function') render();
    setTimeout(cleanVipUnavailableCards, 120);
  });
  window.addEventListener('load', function(){
    setTimeout(cleanVipUnavailableCards, 120);
    setTimeout(cleanVipUnavailableCards, 500);
  });
})();
</script>

<script id="almalika-v300-decor-gallery-existing-only-js">
(function(){
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function nOf(p){return Number(p && (p.number||p.id||0));}
  function isEventDecor(p){
    var cat=String((p&&p.category)||''), typ=String((p&&p.type)||''), name=String((p&&p.name)||'');

  }
  function baseFile(p){
    var n=nOf(p);
    return String((p&&p.image)||'').trim() || (n ? (n+'.jpg') : '');
  }
  function variants(file){
    var a=[]; function add(x){if(x && a.indexOf(x)<0)a.push(x)}
    add(file);
    if(/\.jpg$/i.test(file)) add(file.replace(/\.jpg$/i,'.jpg'));
    if(/\.jpg$/i.test(file)) add(file.replace(/\.jpg$/i,'.jpg'));
    if(/\.png$/i.test(file)){ add(file.replace(/\.png$/i,'.jpg')); add(file.replace(/\.png$/i,'.jpg')); }
    return a;
  }
  function candidates(p){
    var n=nOf(p), out=[]; function add(x){x=String(x||'').trim(); if(x && out.indexOf(x)<0) out.push(x);}

    if(typeof window.decorGalleryFiles==='function'){
      try{(window.decorGalleryFiles(p)||[]).forEach(function(x){variants(x).forEach(add);});}catch(e){}
    }

      // Probe common names, but create thumbnails ONLY after the image loads successfully.
      for(var i=1;i<=20;i++){add(n+'-'+i+'.jpg');add(n+'-'+i+'.jpg');add(n+'-'+i+'.png');}
    }
    return out;
  }
  function loadFirst(list, ok, fail){
    var i=0;
    function next(){
      if(i>=list.length){ if(fail) fail(); return; }
      var src=list[i++], im=new Image();
      im.onload=function(){ ok(src); };
      im.onerror=next;
      im.src=src;
    }
    next();
  }
  function addThumb(n, src, label, active){

document.addEventListener('DOMContentLoaded',function(){data();run(document);});document.addEventListener('click',function(){setTimeout(function(){data();run(document);},50);},true);if(window.MutationObserver)new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes||[],function(n){if(n.nodeType===1)run(n);});});}).observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){data();run(document);},100);setTimeout(function(){data();run(document);},700);

<script id="almalika-v306-gallery-click-zoom-js">
(function(){
  function qs(s,r){return (r||document).querySelector(s)}
  function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function ensureZoom(){
    var z=document.getElementById('almalikaImageZoom');
    if(z) return z;
    z=document.createElement('div');
    z.id='almalikaImageZoom';
    z.innerHTML='<button type="button" class="zoomClose" aria-label="إغلاق">×</button><img alt="صورة مكبرة">';
    document.body.appendChild(z);
    z.addEventListener('click',function(e){ if(e.target===z || e.target.classList.contains('zoomClose')) z.classList.remove('show'); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') z.classList.remove('show'); });
    return z;
  }
  function openZoom(src){
    if(!src) return;
    var z=ensureZoom();
    var im=qs('img',z);
    im.src=src;
    z.classList.add('show');
  }
  function forcePanelRight(){
    try{
      var box=qs('#modal .modalBox.hasDecorMedia, #modal .modalBox.detailed.eventDetailed, #modal .modalBox.detailed.hasDecorMedia');
      if(box){box.style.display='flex';box.style.flexDirection=(window.innerWidth>980?'row':'column');box.style.direction='rtl';}
      var pic=qs('#modal .modalBox .modalPic');
      var info=qs('#modal .modalBox .modalInfo');
      if(pic){pic.style.order='0';pic.style.direction='rtl';pic.style.textAlign='right';}
      if(info){info.style.order='1';info.style.direction='rtl';info.style.textAlign='right';}
    }catch(e){}
  }
  function updateMainFromButton(btn){
    try{
      var modal=qs('#modal');
      if(!modal || !btn) return;
      var imgEl=qs('img',btn);
      var src=(btn.dataset&& (btn.dataset.fullSrc||btn.dataset.decorImg)) || (imgEl&&imgEl.currentSrc) || (imgEl&&imgEl.src) || '';
      if(!src) return;
      var main=qs('.modalPic .mainDecorImg, .modalPic .v302MainImg, .modalPic .mainDecorPreview, .modalPic .v302MainWrap img',modal);
      if(main){
        main.style.display='block';
        main.style.visibility='visible';
        main.src=src;
        main.dataset.fullSrc=src;
      }
      qsa('.decorThumb',modal).forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      var n=(btn.getAttribute('onclick')||'').match(/selectDecorImage\((\d+)/);
      var hidden=n?document.getElementById('decorImage_'+n[1]):null;
      var lab=n?document.getElementById('decorImageLabel_'+n[1]):null;
      if(hidden) hidden.value=(btn.dataset&&btn.dataset.decorImg)||src;
      if(lab) lab.value=(btn.dataset&&btn.dataset.decorLabel)||btn.textContent.trim()||'الصورة المختارة';
    }catch(e){}
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest && e.target.closest('#modal .decorThumb');
    if(btn){ setTimeout(function(){updateMainFromButton(btn);forcePanelRight();},0); return; }
    var main=e.target.closest && e.target.closest('#modal .modalPic .mainDecorImg, #modal .modalPic .v302MainImg, #modal .modalPic .mainDecorPreview, #modal .modalPic .v302MainWrap img');
    if(main){
      var src=main.dataset.fullSrc || main.currentSrc || main.src;
      openZoom(src);
    }
  },true);
  var oldSelect=window.selectDecorImage;
  window.selectDecorImage=function(n,img,btn){
    try{ if(typeof oldSelect==='function') oldSelect.apply(this,arguments); }catch(e){}
    try{ updateMainFromButton(btn); }catch(e){}
    try{ forcePanelRight(); }catch(e){}
  };
  var oldOpen=window.openProduct;
  if(typeof oldOpen==='function'){
    window.openProduct=function(){
      var r=oldOpen.apply(this,arguments);
      setTimeout(forcePanelRight,0);
      setTimeout(forcePanelRight,80);
      setTimeout(forcePanelRight,300);
      return r;
    };
  }
  document.addEventListener('DOMContentLoaded',function(){ensureZoom();forcePanelRight();});
  setTimeout(forcePanelRight,0);setTimeout(forcePanelRight,500);
})();
</script>

<style id="almalika-v326-force-balloon-colors-style">

<script id="almalika-v326-force-balloon-colors-js">
(function(){
  function isTarget(n){n=Number(n); return n===210||n===211||n===250;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var fallbackColors = [
    ['أبيض','#ffffff'],['ذهبي','#d4af37'],['فضي','#c0c0c0'],['وردي','#ff8cc6'],['أزرق','#64b5f6'],['بنفسجي','#9c27b0'],['أحمر','#ef4444'],['أصفر','#fde047'],['أخضر','#22c55e'],['أسود','#111111']
  ];
  function buildBalloonBox(n){
    if(typeof window.balloonColorHtml==='function'){
      try{
        var html = window.balloonColorHtml(n);
        if(html && html.indexOf('balloon_'+n)>=0) return html;
      }catch(e){}
    }
    return '<div class="balloonColorBox forcedBalloonColors210211250" id="forcedBalloonBox_'+n+'">'+
      '<div class="choiceBoxTitle">🎈 اختيار ألوان البالونات</div>'+
      '<div class="colorSwatches">'+fallbackColors.map(function(c){return '<label class="colorSwatch"><input type="checkbox" name="balloon_'+n+'" value="'+esc(c[0])+'"><span class="colorDot" style="background:'+c[1]+'"></span>'+esc(c[0])+'</label>';}).join('')+'</div>'+
      '<div class="addonHint">يمكن اختيار لون واحد أو أكثر، وإذا تركها الزبون فاضية يتم التنسيق مع الإدارة.</div>'+
      '</div>';
  }
  function currentProductNumber(){
    var tag=document.querySelector('#modal .modalInfo .tag');
    if(tag){var m=String(tag.textContent||'').match(/#?\s*(\d+)/); if(m)return Number(m[1]);}
    var title=document.querySelector('#modal [id^="date_"]');
    if(title){var m2=title.id.match(/date_(\d+)/); if(m2)return Number(m2[1]);}
    return 0;
  }
  function ensureBalloonBox(){
    try{
      var n=currentProductNumber();
      if(!isTarget(n)) return;
      var info=document.querySelector('#modal .modalInfo');
      if(!info) return;
      if(info.querySelector('input[name="balloon_'+n+'"]')) return;
      var insertBefore = info.querySelector('.workNotice, .workingHoursHint, textarea[id="note_'+n+'"], .modalActions');
      var holder=document.createElement('div');
      holder.className='forcedBalloonColors210211250';
      holder.innerHTML=buildBalloonBox(n);
      if(insertBefore) info.insertBefore(holder, insertBefore); else info.appendChild(holder);
    }catch(e){}
  }
  var oldOpen=window.openProduct;
  if(typeof oldOpen==='function'){
    window.openProduct=function(){
      var r=oldOpen.apply(this, arguments);
      setTimeout(ensureBalloonBox,0);
      setTimeout(ensureBalloonBox,100);
      setTimeout(ensureBalloonBox,350);
      return r;
    };
  }
  document.addEventListener('click',function(){setTimeout(ensureBalloonBox,80);setTimeout(ensureBalloonBox,250);},true);
  if(false && window.MutationObserver){
    setTimeout(function(){var modal=document.getElementById('modal'); if(modal) new MutationObserver(function(){ensureBalloonBox();}).observe(modal,{childList:true,subtree:true});},200);
  }
  setTimeout(ensureBalloonBox,0); setTimeout(ensureBalloonBox,700);
})();
</script>

<script id="almalika-v329-pastel-symbols-js">
(function(){
  const names={home:'الرئيسية',bouncies:'النطاطيات والزحلاقيات',snacks:'السناك والعربات',events:'تجهيز الحفلات',rentals:'الطاولات والكراسي والشخصيات',offers:'العروض والبكجات',other:'بنود أخرى'};
  const countsFor = () => ({
    bouncies:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='bouncies').length,
    snacks:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='snacks').length,
    events:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='events').length,
    rentals:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='rentals').length,
    other:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='other').length,
    offers:(((typeof products!=='undefined')?products:window.products)||[]).filter(p=>typeof sectionOf==='function'&&sectionOf(p)==='offers').length
  });
  function svg(sec, size){
    size=size||56;
    const map={
      home:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><path d="M32 10l16 9c4 2 5 8 1 11l-17 13-17-13c-4-3-3-9 1-11l16-9z" fill="#f4a11a"/><path d="M22 39h20v10c0 4-3 7-7 7h-6c-4 0-7-3-7-7V39z" fill="#ff5fa2"/><circle cx="20" cy="26" r="4" fill="#ffd777"/><circle cx="44" cy="26" r="4" fill="#ffd777"/><circle cx="32" cy="20" r="4" fill="#ffd777"/><path d="M27 33h10" stroke="#ffd777" stroke-width="3" stroke-linecap="round"/></g></svg>`,
      bouncies:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><path d="M10 52V31l9-9h26l9 9v21z" fill="#ffce5b"/><path d="M15 52V34l8-7h18l8 7v18z" fill="#ff7fa8"/><path d="M23 27l4-15 8 8 8-8 4 15" fill="#ff8a2a"/><rect x="18" y="36" width="8" height="16" rx="2" fill="#73c9ff"/><rect x="38" y="36" width="8" height="16" rx="2" fill="#73c9ff"/><rect x="28" y="40" width="8" height="12" rx="2" fill="#fff5ee"/></g></svg>`,
      snacks:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><rect x="14" y="27" width="36" height="20" rx="4" fill="#ffd777"/><path d="M18 21h28l4 8H14z" fill="#ff8c4b"/><path d="M22 47h20v5H22z" fill="#ff5fa2"/><circle cx="20" cy="54" r="4" fill="#b95d25"/><circle cx="44" cy="54" r="4" fill="#b95d25"/><path d="M24 16c0-3 2-5 5-5 2 0 4 1 5 3 1-2 3-3 5-3 3 0 5 2 5 5" fill="none" stroke="#ff5fa2" stroke-width="3" stroke-linecap="round"/></g></svg>`,
      events:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><circle cx="19" cy="24" r="8" fill="#ff82bc"/><circle cx="32" cy="16" r="8" fill="#ffd777"/><circle cx="45" cy="24" r="8" fill="#a4d9ff"/><path d="M19 32l3 14M32 24v22M45 32l-3 14" stroke="#c48a3d" stroke-width="2.6" stroke-linecap="round"/><path d="M24 44h16v10H24z" fill="#ff5fa2"/><path d="M20 38l12 8 12-8" fill="#ff97c7"/><path d="M32 38v16" stroke="#fff" stroke-width="2.5"/></g></svg>`,
      rentals:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><rect x="14" y="20" width="18" height="12" rx="4" fill="#7de0d7"/><rect x="16" y="32" width="4" height="18" rx="2" fill="#56bdb3"/><rect x="26" y="32" width="4" height="18" rx="2" fill="#56bdb3"/><rect x="36" y="26" width="16" height="6" rx="3" fill="#ffce5b"/><rect x="42" y="32" width="4" height="18" rx="2" fill="#d8a93f"/><rect x="34" y="32" width="4" height="18" rx="2" fill="#d8a93f"/></g></svg>`,
      offers:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><rect x="14" y="24" width="36" height="26" rx="5" fill="#cfb5ff"/><path d="M14 30h36" stroke="#fff" stroke-width="3"/><path d="M32 24v26" stroke="#fff" stroke-width="3"/><path d="M22 21c0-4 5-6 8-2l2 3-2 2h-3c-3 0-5-1-5-3z" fill="#ff84ba"/><path d="M42 21c0-4-5-6-8-2l-2 3 2 2h3c3 0 5-1 5-3z" fill="#ffd777"/></g></svg>`,
      other:`<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g><path d="M20 35c4-8 10-12 12-12s8 4 12 12c-4 5-10 8-12 8s-8-3-12-8z" fill="#67c7ff"/><circle cx="32" cy="20" r="7" fill="#9fdcff"/><circle cx="18" cy="24" r="4" fill="#bfe8ff"/><circle cx="46" cy="24" r="4" fill="#bfe8ff"/></g></svg>`
    };
    return map[sec]||map.home;
  }
  function navHTML(sec,label,active){
    return `<button class="v329NavBtn ${active?'active':''}" onclick="showSection('${sec}')"><span class="v329NavBubble v329-${sec}">${svg(sec,22)}</span><span class="v329NavLabel">${label}</span></button>`;
  }
  function patchNav(){
    const nav=document.getElementById('nav');
    const secs=(typeof sections!=='undefined')?sections:(window.sections||[]);
    const cur=(typeof current!=='undefined')?current:window.current;
    if(!nav||!secs||!secs.length) return;
    nav.innerHTML=secs.map(s=>navHTML(s[0], s[1], cur===s[0])).join('');
  }
  function decorateHomeCards(){
    const wrap=document.querySelector('.mainCats'); if(!wrap) return;
    const countMap=countsFor();
    wrap.querySelectorAll('.cat').forEach(btn=>{
      const m=(btn.getAttribute('onclick')||'').match(/showSection\('([^']+)'\)/); if(!m) return;
      const sec=m[1]; if(sec==='home') return;
      btn.classList.add('v329DecorCat','v329-'+sec);
      const label=(btn.querySelector('h3')?.textContent||names[sec]||'').trim();
      const count = countMap[sec] || btn.querySelector('p')?.textContent || '';
      const bubbleClass=(sec==='events'||sec==='other'||sec==='rentals'||sec==='offfers')?'round':'';
      btn.innerHTML=`<div class="v329CardBubble ${sec==='other'?'round':''}">${svg(sec,60)}</div><h3>${label}</h3><p>${count}</p><div class="v329Explore">استكشف</div>`;
    });
    const t=document.querySelector('.title h2');
    if(t && /الأقسام الرئيسية/.test(t.textContent) && !t.querySelector('.v329TitleIcon')){
      t.innerHTML=`الأقسام الرئيسية <span class="v329TitleIcon">${svg('offers',20)}</span>`;
    }
  }
  const oldRenderNav=window.renderNav;
  window.renderNav=function(){ if(typeof oldRenderNav==='function'){ oldRenderNav.apply(this,arguments); } patchNav(); };
  const oldRenderHome=window.renderHome;
  window.renderHome=function(){ if(typeof oldRenderHome==='function'){ oldRenderHome.apply(this,arguments); } patchNav(); decorateHomeCards(); };
  const oldRender=window.render;
  window.render=function(){ if(typeof oldRender==='function'){ oldRender.apply(this,arguments); } patchNav(); if(((typeof current!=='undefined')?current:window.current)==='home') decorateHomeCards(); };
  document.addEventListener('DOMContentLoaded',function(){ setTimeout(function(){ patchNav(); if(((typeof current!=='undefined')?current:window.current)==='home') decorateHomeCards(); },50); });
  setTimeout(function(){ patchNav(); if(((typeof current!=='undefined')?current:window.current)==='home') decorateHomeCards(); },300);
})();
</script>

<script id="almalika-v336-clean-footer-js">
(function(){

  const INFO={

  };
  function enc(s){return encodeURIComponent(String(s||''));}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function waUrl(c,msg){return 'https://wa.me/'+c.wa+'?text='+enc(msg||'السلام عليكم، أريد التواصل مع إدارة شركة الملكة للحفلات.');}
  function telUrl(c){return 'tel:'+c.phone;}
  function ensureModal(){let m=document.getElementById('v336InfoModal');if(m)return m;m=document.createElement('div');m.id='v336InfoModal';m.className='v336ModalOverlay';m.innerHTML='<div class="v336ModalBox"><button class="v336ModalClose" onclick="document.getElementById(\'v336InfoModal\').classList.remove(\'show\')">×</button><div id="v336ModalContent"></div></div>';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')});return m;}

  function productMsg(n){try{const p=(typeof products!=='undefined'?products:[]).find(x=>Number(x.number)===Number(n));if(!p)return 'السلام عليكم، أريد الاستفسار عن كتالوج شركة الملكة للحفلات.';return 'السلام عليكم، أريد الاستفسار عن المنتج:\n#'+p.number+' - '+p.name+'\nالقسم: '+(p.category||'')+'\nالسعر يبدأ من: '+(typeof price==='function'?price(p):Number(p.priceOneDay||0))+' ر.ق';}catch(e){return 'السلام عليكم، أريد الاستفسار عن كتالوج شركة الملكة للحفلات.'}}

<script id="almalika-v337-balloon-selected-js">
(function(){
  function syncBalloonSelectedState(root){
    root = root || document;
    root.querySelectorAll('label.colorSwatch').forEach(function(label){
      var input = label.querySelector('input[name^="balloon_"]');
      if(!input) return;
      if(input.checked) label.classList.add('is-selected');
      else label.classList.remove('is-selected');
    });
  }
  document.addEventListener('change', function(e){
    var t = e.target;
    if(t && t.matches && t.matches('input[name^="balloon_"]')) syncBalloonSelectedState(document);
  }, true);
  document.addEventListener('click', function(){
    setTimeout(function(){ syncBalloonSelectedState(document); }, 0);
    setTimeout(function(){ syncBalloonSelectedState(document); }, 120);
  }, true);
  if(false && window.MutationObserver){
    setTimeout(function(){
      try{
        new MutationObserver(function(){ syncBalloonSelectedState(document); }).observe(document.body,{childList:true,subtree:true});
      }catch(e){}
    },300);
  }
  var oldOpenProduct = window.openProduct;
  if(typeof oldOpenProduct === 'function' && !window.__v337BalloonSyncWrapped){
    window.__v337BalloonSyncWrapped = true;
    window.openProduct = function(){
      var out = oldOpenProduct.apply(this, arguments);
      setTimeout(function(){ syncBalloonSelectedState(document); }, 0);
      setTimeout(function(){ syncBalloonSelectedState(document); }, 150);
      setTimeout(function(){ syncBalloonSelectedState(document); }, 450);
      return out;
    };
  }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){ syncBalloonSelectedState(document); }, 100);
    setTimeout(function(){ syncBalloonSelectedState(document); }, 500);
  });
  setTimeout(function(){ syncBalloonSelectedState(document); }, 200);
})();
</script>

<script id="almalika-v344-delete-412-422-js">
(function(){
  var MIN=412, MAX=422;
  function banned(x){var n=Number((x&&x.number)||(x&&x.id)||x||0);return n>=MIN&&n<=MAX;}
  function removeFromArray(arr){
    if(!Array.isArray(arr)) return false;
    var changed=false;
    for(var i=arr.length-1;i>=0;i--){if(banned(arr[i])){arr.splice(i,1);changed=true;}}
    return changed;
  }
  function cleanup(){
    try{ if(typeof products!=='undefined') removeFromArray(products); }catch(e){}
    try{ if(Array.isArray(window.products)) removeFromArray(window.products); }catch(e){}
    try{
      if(typeof cart!=='undefined' && removeFromArray(cart)){ if(typeof saveCart==='function') saveCart(); else localStorage.setItem('almalikaCart',JSON.stringify(cart)); }
    }catch(e){}
    try{ if(Array.isArray(window.cart) && removeFromArray(window.cart)) localStorage.setItem('almalikaCart',JSON.stringify(window.cart)); }catch(e){}
    try{
      var saved=JSON.parse(localStorage.getItem('almalikaCart')||'[]');
      if(removeFromArray(saved)) localStorage.setItem('almalikaCart',JSON.stringify(saved));
    }catch(e){}
    try{
      document.querySelectorAll('.product').forEach(function(card){
        var n=Number(card.getAttribute('data-number')||0);
        if(!n){
          var num=card.querySelector('.num');
          if(num) n=Number(String(num.textContent||'').replace(/[^0-9]/g,''));
        }
        if(n>=MIN&&n<=MAX) card.remove();
      });
    }catch(e){}
  }
  cleanup();
  var oldCard=window.card;
  if(typeof oldCard==='function'){
    window.card=card=function(p){ if(banned(p)) return ''; return oldCard.apply(this,arguments); };
  }
  var oldOpen=window.openProduct;
  if(typeof oldOpen==='function'){
    window.openProduct=openProduct=function(n){ if(banned(n)){alert('هذا المنتج محذوف من الموقع.');return;} return oldOpen.apply(this,arguments); };
  }
  var oldAdd=window.addToCart;
  if(typeof oldAdd==='function'){
    window.addToCart=addToCart=function(n){ if(banned(n)){alert('هذا المنتج محذوف من الموقع.');return;} return oldAdd.apply(this,arguments); };
  }
  var oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){ cleanup(); var r=oldRender.apply(this,arguments); setTimeout(cleanup,0); return r; };
  }
  var oldOpenCart=window.openCart;
  if(typeof oldOpenCart==='function'){
    window.openCart=function(){ cleanup(); return oldOpenCart.apply(this,arguments); };
  }
  document.addEventListener('DOMContentLoaded', cleanup);
  setTimeout(cleanup,0); setTimeout(cleanup,300);
})();
</script>
