<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الملكة | متجر الحجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --pink:#f7257f; --pink2:#ff5fa2; --maroon:#7a173f; --blue:#0ea5e9;
  --bg:#fff8fb; --text:#24151d; --muted:#786b73; --line:#f0dbe5;
  --card:#fff; --shadow:0 12px 30px rgba(122,23,63,.10);
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#fff,#fff8fb);color:var(--text);overflow-x:hidden}
.top-black{background:#111;color:#fff;height:42px;display:flex;align-items:center;overflow:hidden;font-weight:900;white-space:nowrap;border-bottom:3px solid #e11d48}
.top-black b{background:#c8102e;height:100%;display:flex;align-items:center;padding:0 18px;margin-left:12px}
.top-blue{background:linear-gradient(180deg,#0496e8,#0875cb);color:#fff;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 6px 16px rgba(0,104,200,.22)}
.app{max-width:520px;margin:0 auto;padding-bottom:88px;background:#fff;min-height:100vh}
.app-head{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid #f3e5ec}
.head-row{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.logo{font-size:34px;font-weight:900;color:var(--maroon);text-align:center;line-height:1}
.icon-btn{height:44px;width:44px;border:0;border-radius:16px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.08);font-size:25px;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-6px;right:-5px;background:var(--pink);color:#fff;font-size:12px;font-weight:900;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;border:2px solid #fff}
.cats-wrap{margin-top:14px;border:1px solid var(--line);border-radius:22px;padding:10px 8px;background:#fff;box-shadow:0 8px 20px rgba(122,23,63,.05)}
.cats{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 86px;scroll-snap-align:center;border:0;background:transparent;text-align:center;color:#4a3841;font-weight:800}
.cat .ico{width:58px;height:58px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.08);font-size:27px;border:1px solid #f4e6ed}
.cat.active .ico{background:linear-gradient(135deg,#ff2d80,#ff72ad);color:#fff}
.cat span{display:block;font-size:12px;line-height:1.25;min-height:31px}
.search{margin-top:14px;height:58px;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 8px 18px rgba(0,0,0,.04)}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%;font-size:17px;font-weight:800;color:#3f2d36;text-align:right}
.search .mag{font-size:28px;color:#333}
.hero{margin:16px;border-radius:22px;overflow:hidden;min-height:190px;background:linear-gradient(90deg,#fff 0 43%,#ffe7f1 44%);box-shadow:var(--shadow);display:grid;grid-template-columns:45% 55%;align-items:center}
.hero-copy{padding:22px 18px;text-align:center}
.hero-copy h2{margin:0 0 8px;font-size:24px;line-height:1.35}
.hero-copy p{margin:0 0 16px;color:var(--pink);font-weight:900}
.hero-copy button{border:0;border-radius:999px;background:linear-gradient(135deg,#ff2d80,#f7257f);color:#fff;padding:12px 26px;font-weight:900;font-size:16px}
.hero-img{height:100%;background:radial-gradient(circle,#ffd6e6,#fff);display:grid;place-items:center;font-size:80px}
.section-title{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin:14px 0 10px}
.section-title h2{margin:0;font-size:22px}
.section-title button{border:0;background:transparent;color:var(--pink);font-weight:900;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 20px}
.card{background:#fff;border:1px solid #f2e2e9;border-radius:18px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.07);position:relative}
.fav{position:absolute;top:9px;left:9px;width:35px;height:35px;border-radius:50%;border:0;background:#fff;font-size:20px;box-shadow:0 5px 12px rgba(0,0,0,.12);z-index:2}
.card-img{height:136px;background:#fff7dc;display:grid;place-items:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .ph{font-size:55px}
.card-body{padding:10px 10px 12px;text-align:center}
.card-title{font-size:15px;font-weight:900;line-height:1.35;min-height:41px;display:block;overflow:hidden}
.card-desc{font-size:12px;color:var(--muted);font-weight:700;line-height:1.35;min-height:32px;margin:5px 0}
.price{font-size:20px;font-weight:900;color:var(--pink);margin:6px 0 10px}
.add{width:100%;height:38px;border:0;border-radius:10px;background:linear-gradient(135deg,#ff2d80,#f7257f);color:#fff;font-weight:900;font-size:15px}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 28px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;border-top:1px solid #f0dbe5}
.bn{border:0;background:transparent;font-weight:800;color:#555;display:grid;place-items:center;font-size:12px;padding:6px 0}
.bn b{font-size:25px;line-height:1}
.bn.home b{background:var(--pink);color:#fff;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px rgba(247,37,127,.35)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end}
.drawer.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;text-align:center}
.close{border:0;background:#f3f3f3;border-radius:12px;height:44px;width:100%;font-weight:900;margin-top:10px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet-actions button{height:48px;border:0;border-radius:14px;font-weight:900;color:#fff;background:var(--pink);font-size:16px}
.sheet-actions button.black{background:#111}
@media(min-width:700px){
  body{background:#f7f7f7}
  .app{box-shadow:0 0 0 1px #eee}
}
</style>
</head>
<body>
<div class="app">
  <div class="top-black"><b>آخر العروض ●</b><span>🔥 زحلاقية بيبي شرك المائية — يبدأ من 700 ر.ق · 🔥 عروض الصيف</span></div>
  <div class="top-blue">وفر 15% &nbsp; <small>الكود: ALMALIKA15</small></div>
  <header class="app-head">
    <div class="head-row">
      <button class="icon-btn" id="cartTop">🛒<span class="badge" id="cartBadge">0</span></button>
      <div class="logo">الملكة 👑</div>
      <button class="icon-btn">☰</button>
    </div>
    <div class="cats-wrap"><div class="cats" id="cats"></div></div>
    <label class="search"><input id="search" placeholder="إبحث بالرقم أو الاسم أو القسم..."><span class="mag">⌕</span></label>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <h2>ديكورات حفلة عيد<br>استاند مربع</h2>
      <p>كبير + صغير</p>
      <button onclick="setCat('تجهيز الحفلات')">تسوق الآن</button>
    </div>
    <div class="hero-img">🎈</div>
  </section>

  <div class="section-title"><button onclick="setCat('الكل')">عرض الكل</button><h2>الأكثر مبيعاً</h2></div>
  <main class="grid" id="grid"></main>
</div>

<nav class="bottom-nav">
  <button class="bn"><b>👤</b><span>الحساب</span></button>
  <button class="bn"><b>♡</b><span>المفضلة</span></button>
  <button class="bn home"><b>⌂</b><span>الرئيسية</span></button>
  <button class="bn"><b>▣</b><span>طلباتي</span></button>
  <button class="bn" id="cartBottom"><b>🛒</b><span>السلة</span></button>
</nav>

<div class="drawer" id="drawer">
  <div class="sheet">
    <h2 id="sheetTitle">تفاصيل المنتج</h2>
    <div id="sheetBody"></div>
    <div class="sheet-actions">
      <button onclick="addCurrent()">أضف للسلة 🛒</button>
      <button class="black" onclick="closeSheet()">إغلاق</button>
    </div>
  </div>
</div>

<script>
const PRODUCTS = [{"id": "1", "title": "${vipGeneralProducts().map(card).join('')}", "desc": "${vipGeneralProducts().map(card).join('')}", "price": "", "category": "", "img": ""}, {"id": "2", "title": "${vipOfferProducts().length?vipOfferProducts().map", "desc": "${vipOfferProducts().length?vipOfferProducts().map(card).join(''):' لا توجد عروض مضافة حالياً", "price": "", "category": "", "img": ""}, {"id": "3", "title": "${icon(current)} ${name} عدد البنود المعروضة: ${ar", "desc": "${icon(current)} ${name} عدد البنود المعروضة: ${arr.length} — اضغط على الصورة أو التفاصيل لفتح بيانات المنتج.", "price": "", "category": "", "img": ""}, {"id": "4", "title": "${arr.length?arr.map(card).join(''):' لا توجد منتج", "desc": "${arr.length?arr.map(card).join(''):' لا توجد منتجات مطابقة للبحث أو الفلتر الحالي", "price": "", "category": "", "img": ""}, {"id": "5", "title": "#${p.number}", "desc": "#${p.number}", "price": "", "category": "", "img": ""}, {"id": "6", "title": "◯ ${esc(x[1])} ${esc(x[3])} ${x[2]} ر.ق `).join(''", "desc": "◯ ${esc(x[1])} ${esc(x[3])} ${x[2]} ر.ق `).join(''); return ` اختيار الطاولات والملصقات إذا وجدت طاولات أسطوانية إضافية", "price": "", "category": "", "img": ""}, {"id": "7", "title": "قريبًا سيتم إضافة صور أكثر قريبًا", "desc": "قريبًا سيتم إضافة صور أكثر قريبًا", "price": "", "category": "", "img": ""}, {"id": "8", "title": "${svg(sec,60)}", "desc": "${svg(sec,60)}", "price": "", "category": "", "img": ""}, {"id": "9", "title": "'+esc(c.name)+' '+esc(c.phone+' — '+c.desc)+' واتس", "desc": "'+esc(c.name)+' '+esc(c.phone+' — '+c.desc)+' واتساب اتصال", "price": "", "category": "", "img": ""}, {"id": "10", "title": "'+esc(c.name)+' '+esc(c.phone+' — '+c.desc)+' واتس", "desc": "'+esc(c.name)+' '+esc(c.phone+' — '+c.desc)+' واتساب اتصال", "price": "", "category": "", "img": ""}, {"id": "11", "title": "✨ تجربة جديدة قبل الدخول كل تجهيزات حفلتك في مكان ", "desc": "✨ تجربة جديدة قبل الدخول كل تجهيزات حفلتك في مكان واحد نطاطيات، زحلاقيات، سناك، ديكورات، طاولات، عروض وبكجات — بتجربة جو", "price": "", "category": "", "img": ""}, {"id": "12", "title": "قريبًا سيتم إضافة صور جديدة", "desc": "قريبًا سيتم إضافة صور جديدة", "price": "", "category": "", "img": ""}, {"id": "13", "title": "'+escHtml(p.name||'')+' يبدأ من '+escHtml(minPrice", "desc": "'+escHtml(p.name||'')+' يبدأ من '+escHtml(minPrice(p))+'", "price": "", "category": "", "img": ""}, {"id": "14", "title": "قريبًا سيتم إضافة صور جديدة", "desc": "قريبًا سيتم إضافة صور جديدة", "price": "", "category": "", "img": ""}, {"id": "15", "title": "'+esc(p.name||'')+' يبدأ من '+esc(minPrice(p))+'", "desc": "'+esc(p.name||'')+' يبدأ من '+esc(minPrice(p))+'", "price": "", "category": "", "img": ""}];
const CATS = ["الرئيسية", "النطاطيات والزحلاقيات", "تجهيز الحفلات", "السناك والعربات", "العروض والبكجات", "الطاولات والكراسي", "بنود أخرى"];
const catIcons = ["⌂","🏰","🎈","🎁","🛒","🏷️","🪑","•••","🎉","⭐"];
let activeCat = "الكل";
let cart = [];
let currentProduct = null;

function imageSrc(p) {
  return p.img && !p.img.startsWith("data:") ? p.img : "";
}
function norm(s) { return (s||"").toString().toLowerCase().trim(); }
function renderCats() {
  const box = document.getElementById("cats");
  const all = ["الكل", ...CATS.filter(c => c && c !== "الرئيسية")];
  box.innerHTML = all.map((c,i)=>`
    <button class="cat ${c===activeCat?'active':''}" onclick="setCat('${c.replace(/'/g,"\'")}')">
      <div class="ico">${catIcons[i%catIcons.length]}</div><span>${c==="الكل"?"الرئيسية":c}</span>
    </button>`).join("");
}
function setCat(c) { activeCat = c; renderCats(); renderProducts(); window.scrollTo({top:0,behavior:"smooth"}); }
function filtered() {
  const q = norm(document.getElementById("search").value);
  return PRODUCTS.filter(p => {
    const hay = norm([p.id,p.title,p.desc,p.category].join(" "));
    const catOk = activeCat==="الكل" || activeCat==="الرئيسية" || norm(p.category).includes(norm(activeCat)) || hay.includes(norm(activeCat));
    return catOk && (!q || hay.includes(q));
  });
}
function renderProducts() {
  const grid = document.getElementById("grid");
  const list = filtered();
  grid.innerHTML = list.map((p,idx)=>`
    <article class="card">
      <button class="fav" onclick="event.stopPropagation()">♡</button>
      <div class="card-img" onclick="openProduct(${idx})">
        ${imageSrc(p)?`<img src="${imageSrc(p)}" loading="lazy">`:`<div class="ph">🎪</div>`}
      </div>
      <div class="card-body">
        <div class="card-title">${p.title||"منتج"}</div>
        <div class="card-desc">${p.desc||p.category||""}</div>
        <div class="price">${p.price?`ر.ق ${p.price}`:"حسب الطلب"}</div>
        <button class="add" onclick="addToCart(${idx})">أضف للسلة 🛒</button>
      </div>
    </article>`).join("") || `<div style="grid-column:1/-1;text-align:center;padding:40px;font-weight:900">لا توجد نتائج</div>`;
}
function openProduct(idx) {
  currentProduct = filtered()[idx];
  const img = imageSrc(currentProduct);
  document.getElementById("sheetTitle").textContent = currentProduct.title || "تفاصيل المنتج";
  document.getElementById("sheetBody").innerHTML = `
    <div style="border-radius:18px;overflow:hidden;background:#fff7dc;min-height:220px;display:grid;place-items:center;margin-bottom:12px">
      ${img?`<img src="${img}" style="width:100%;max-height:320px;object-fit:contain">`:`<div style="font-size:70px">🎪</div>`}
    </div>
    <p style="text-align:center;color:#777;font-weight:800;line-height:1.8">${currentProduct.desc||""}</p>
    <div style="text-align:center;color:var(--pink);font-size:28px;font-weight:900">${currentProduct.price?`ر.ق ${currentProduct.price}`:"حسب الطلب"}</div>`;
  document.getElementById("drawer").classList.add("show");
}
function closeSheet() { document.getElementById("drawer").classList.remove("show"); }
function addToCart(idx) { cart.push(filtered()[idx]); updateCart(); }
function addCurrent() { if(currentProduct) cart.push(currentProduct); updateCart(); closeSheet(); }
function updateCart() { document.getElementById("cartBadge").textContent = cart.length; }
document.getElementById("search").addEventListener("input", ()=>{ activeCat="الكل"; renderCats(); renderProducts(); });
document.getElementById("cartTop").onclick = document.getElementById("cartBottom").onclick = function() {
  document.getElementById("sheetTitle").textContent = "سلة الحجز";
  document.getElementById("sheetBody").innerHTML = cart.length ? cart.map(p=>`<div style="padding:10px;border-bottom:1px solid #eee;font-weight:800">${p.title} <b style="color:var(--pink)">ر.ق ${p.price||""}</b></div>`).join("") : "<p style='text-align:center;font-weight:900'>السلة فارغة</p>";
  document.getElementById("drawer").classList.add("show");
};
renderCats(); renderProducts(); updateCart();
</script>
</body>
</html>
