<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الملكة | متجر الحجز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7257f;--pink2:#ff74af;--maroon:#751638;--bg:#fff8fb;--text:#24151d;--muted:#786b73;--line:#f0dbe5}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#fff8fb;color:var(--text);overflow-x:hidden}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:86px}
.ticker{height:42px;background:#111;color:#fff;display:flex;align-items:center;overflow:hidden;font-weight:900;white-space:nowrap;border-bottom:3px solid #e11d48}
.ticker b{background:#c8102e;padding:0 16px;height:100%;display:flex;align-items:center;margin-left:10px}
.blue{height:50px;background:linear-gradient(#08a7f2,#0875cb);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.header{position:sticky;top:0;background:rgba(255,255,255,.96);z-index:50;backdrop-filter:blur(12px);padding:12px 14px 10px;border-bottom:1px solid #f4e2eb}
.head{display:grid;grid-template-columns:50px 1fr 50px;align-items:center}
.logo{text-align:center;color:var(--maroon);font-size:34px;font-weight:900}
.icon{width:42px;height:42px;border:0;border-radius:15px;background:#fff;box-shadow:0 6px 18px #0001;font-size:24px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;border:2px solid #fff;border-radius:99px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;font-weight:900}
.catbar{margin-top:12px;border:1px solid var(--line);border-radius:22px;padding:9px;background:#fff;box-shadow:0 8px 18px #7a173f0d}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 4px;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 78px;border:0;background:transparent;text-align:center;font-weight:800;color:#4c3742}
.cat .ci{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 6px;font-size:25px;border:1px solid #f3e3eb;box-shadow:0 7px 17px #00000010}
.cat.active .ci{background:linear-gradient(135deg,#ff2d80,#ff7ab4);color:#fff}
.cat span{font-size:11.5px;line-height:1.22;display:block;min-height:28px}
.search{height:56px;margin-top:12px;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;padding:0 14px;background:#fff;box-shadow:0 8px 16px #00000008}
.search input{border:0;outline:0;width:100%;height:100%;font-size:16px;font-weight:800;text-align:right;color:#4a3540;background:transparent}
.search i{font-style:normal;font-size:28px}
.hero{margin:15px;border-radius:22px;overflow:hidden;background:linear-gradient(90deg,#fff 0 45%,#ffe2ef 45%);box-shadow:0 12px 28px #7a173f16;display:grid;grid-template-columns:45% 55%;min-height:182px}
.heroText{padding:20px 16px;text-align:center;align-self:center}
.heroText h2{font-size:22px;line-height:1.35;margin:0 0 8px}
.heroText p{color:var(--pink);font-weight:900;margin:0 0 12px}
.heroText button{border:0;background:linear-gradient(135deg,#ff2d80,#f7257f);color:#fff;border-radius:999px;font-weight:900;padding:11px 24px;font-size:15px}
.heroImg{display:grid;place-items:center;overflow:hidden;background:#fff0f6}
.heroImg img{width:100%;height:100%;object-fit:cover}
.heroImg .ph{font-size:70px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin:12px 0 10px}
.sec h2{font-size:21px;margin:0}
.sec button{border:0;background:transparent;color:var(--pink);font-weight:900;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 13px 20px}
.card{background:#fff;border:1px solid #f2e0e8;border-radius:18px;overflow:hidden;box-shadow:0 10px 22px #0000000d;position:relative}
.card .fav{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 5px 12px #0002;z-index:2;font-size:18px}
.pic{height:135px;background:#fff6da;display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .ph{font-size:52px}
.body{padding:9px 9px 11px;text-align:center}
.title{font-size:15px;font-weight:900;line-height:1.35;min-height:42px}
.desc{font-size:12px;color:var(--muted);font-weight:700;line-height:1.35;min-height:32px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:20px;font-weight:900;color:var(--pink);margin:7px 0 9px}
.add{height:38px;width:100%;border:0;border-radius:10px;background:linear-gradient(135deg,#ff2d80,#f7257f);color:#fff;font-weight:900;font-size:14px}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:74px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 26px #0002;display:grid;grid-template-columns:repeat(5,1fr);z-index:80;border-top:1px solid #f1dfe8}
.bottom button{border:0;background:transparent;font-weight:800;color:#555;font-size:11px;display:grid;place-items:center;padding:5px 0}
.bottom b{font-size:24px}
.bottom .home b{width:52px;height:52px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;margin-top:-20px;box-shadow:0 9px 20px #f7257f55}
.drawer{position:fixed;inset:0;background:#0008;z-index:120;display:none;align-items:flex-end}
.drawer.show{display:flex}
.sheet{width:100%;max-width:520px;margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet h2{text-align:center;margin:0 0 12px;line-height:1.35}
.sheetPic{height:280px;border-radius:20px;overflow:hidden;background:#fff6da;display:grid;place-items:center}
.sheetPic img{width:100%;height:100%;object-fit:contain}
.sheet .info{text-align:center;color:#70636a;font-weight:800;line-height:1.8}
.sheet .bigPrice{text-align:center;color:var(--pink);font-size:28px;font-weight:900}
.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheetActions button{height:48px;border-radius:14px;border:0;font-weight:900;font-size:15px;color:#fff;background:var(--pink)}
.sheetActions .black{background:#111}
@media(min-width:700px){body{background:#f3f3f3}.app{box-shadow:0 0 0 1px #eee}}
</style>
</head>

</div>

const CATS=["الجميع", "النطاطيات والزحلاقيات", "تجهيز الحفلات", "السناك والعربات", "العروض والبكجات", "الطاولات والكراسي", "بنود أخرى", "الملاعب الصابونية", "الزحلاقيات", "النطاطيات المائية", "تجهيز الحفلات والمناسبات", "الطاولات والكراسي والشخصيات", "عروض النطاطيات", "عروض الحفلات والمناسبات"];
const ICONS=["⌂","🏰","🎈","🍿","🎁","🪑","•••","💦","🎪","⭐","🍭","🎂"];
let active="الجميع", cart=[], current=null;
function n(s){return (s||"").toString().toLowerCase().trim()}
function img(p){return p.image||""}
function pr(p){return p.price?("ر.ق "+p.price):"حسب الطلب"}
function renderCats(){document.getElementById("cats").innerHTML=CATS.map((c,i)=>`<button class="cat ${c===active?'active':''}" onclick="setCat('${c.replaceAll("'","\\'")}')"><div class="ci">${ICONS[i%ICONS.length]}</div><span>${c==='الجميع'?'الرئيسية':c}</span></button>`).join("")}
function setCat(c){active=c;renderCats();render();window.scrollTo({top:0,behavior:'smooth'})}
function list(){const q=n(document.getElementById("q").value);return PRODUCTS.filter(p=>{const hay=n([p.id,p.name,p.category,p.type,p.details,p.age].join(" "));const catOk=active==="الجميع"||hay.includes(n(active));return catOk&&(!q||hay.includes(q));})}
function render(){const data=list();document.getElementById("grid").innerHTML=data.map((p,i)=>`<article class="card"><button class="fav">♡</button><div class="pic" onclick="openP(${i})">${img(p)?`<img src="${img(p)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="ph" style="display:none">🎪</div>`:`<div class="ph">🎪</div>`}</div><div class="body"><div class="title">${p.name}</div><div class="desc">${p.type||p.category||p.age||''}</div><div class="price">${pr(p)}</div><button class="add" onclick="add(${i})">أضف للسلة 🛒</button></div></article>`).join("")||"<div style='grid-column:1/-1;text-align:center;font-weight:900;padding:40px'>لا توجد نتائج</div>"}
function openP(i){current=list()[i];document.getElementById("sheetTitle").textContent=current.name;document.getElementById("sheetBody").innerHTML=`<div class="sheetPic">${img(current)?`<img src="${img(current)}">`:`<div style="font-size:80px">🎪</div>`}</div><p class="info">${current.details||current.type||current.category||''}</p><div class="bigPrice">${pr(current)}</div>`;document.getElementById("drawer").classList.add("show")}
function closeSheet(){document.getElementById("drawer").classList.remove("show")}
function add(i){cart.push(list()[i]);upd()}
function addCurrent(){if(current)cart.push(current);upd();closeSheet()}
function upd(){document.getElementById("cartCount").textContent=cart.length}
document.getElementById("q").addEventListener("input",()=>{active="الجميع";renderCats();render()});
document.getElementById("cartTop").onclick=document.getElementById("cartBottom").onclick=()=>{document.getElementById("sheetTitle").textContent="سلة الحجز";document.getElementById("sheetBody").innerHTML=cart.length?cart.map(p=>`<div style="padding:10px;border-bottom:1px solid #eee;font-weight:900">${p.name} <b style="color:var(--pink)">${pr(p)}</b></div>`).join(""):"<p style='text-align:center;font-weight:900'>السلة فارغة</p>";document.getElementById("drawer").classList.add("show")};
renderCats();render();upd();
</script>
