<style id="almalika-v485-mobile-desktop-safe-fix">

.nav,.chips,.mainCats{max-width:100%;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;scrollbar-width:none;}

.nav button,.chip,.cat,.btn{flex:0 0 auto;}
.products{align-items:stretch!important;scroll-margin-top:var(--alm-header-gap)!important;}

.product .bottom,.bottom{margin-top:auto!important;display:flex!important;flex-wrap:wrap!important;align-items:flex-end!important;gap:10px!important;}
.product .actions,.actions{display:flex!important;flex-wrap:wrap!important;gap:8px!important;}
.product .actions button,.actions button{min-height:42px!important;}
.pic,.modalPic{overflow:hidden!important;background:linear-gradient(135deg,#fff,#f0fbff,#fff9d9)!important;}
.pic img,.modalPic img,.product img{object-fit:contain!important;object-position:center center!important;width:100%!important;max-width:100%!important;height:100%!important;max-height:100%!important;}
.cartItem img{object-fit:contain!important;background:#fff!important;}
.modalBox{max-width:96vw!important;}
.modalInfo,.modalPic{min-width:0!important;}
.almalika-v485-anchor{scroll-margin-top:var(--alm-header-gap)!important;}

</style>

<script id="almalika-v485-safe-navigation-and-image-fix">
(function(){
  if(window.__almalikaV485Applied) return;
  window.__almalikaV485Applied = true;

  function allowScroll(ms){
    try{ if(typeof window.almAllowScrollFor === 'function') window.almAllowScrollFor(ms || 1600); }catch(e){}
  }

  function findProductsAnchor(){
    return document.querySelector('#products, .products, [data-products], main .products, section .products');
  }

  function scrollToProductsTop(){
    var el = findProductsAnchor();
    if(!el) return;
    el.classList.add('almalika-v485-anchor');
    allowScroll(1800);
    var header = document.querySelector('.header');
    var gap = header ? (header.getBoundingClientRect().height + 10) : 140;
    var y = Math.max(0, window.pageYOffset + el.getBoundingClientRect().top - gap);
    try{ window.scrollTo({top:y, behavior:'auto'}); }catch(e){ window.scrollTo(0,y); }
  }

  function normalizeProductCards(){
    document.querySelectorAll('.product').forEach(function(card){
      card.style.height = 'auto';
      card.style.maxHeight = 'none';
      var body = card.querySelector('.body');
      if(body){ body.style.height='auto'; body.style.overflow='visible'; }
      card.querySelectorAll('img').forEach(function(img){
        img.style.objectFit = 'contain';
        img.style.objectPosition = 'center center';
        img.loading = img.loading || 'lazy';
      });
    });
  }

  function isHeaderOrCategoryClick(target){
    if(!target || !target.closest) return false;
    var el = target.closest('.nav button, .chip, .cat, .mainCats .cat, [data-cat], [data-category], a[href^="#"]');
    if(!el) return false;
    var text = (el.textContent || '').replace(/\s+/g,' ').trim();
    if(!text) return false;
    if(text.indexOf('السلة') >= 0 || text.indexOf('واتساب') >= 0 || text.indexOf('اتصال') >= 0) return false;
    return true;
  }

  document.addEventListener('click', function(e){
    if(isHeaderOrCategoryClick(e.target)){
      allowScroll(1800);
      setTimeout(scrollToProductsTop, 120);
      setTimeout(scrollToProductsTop, 380);
    }
  }, true);

  document.addEventListener('DOMContentLoaded', function(){
    normalizeProductCards();
    setTimeout(normalizeProductCards, 300);
    setTimeout(normalizeProductCards, 900);
  });
  window.addEventListener('load', function(){
    normalizeProductCards();
    setTimeout(normalizeProductCards, 700);
  });

  try{
    var mo = new MutationObserver(function(){ normalizeProductCards(); });
    mo.observe(document.documentElement, {childList:true, subtree:true});
  }catch(e){}
})();
</script>
